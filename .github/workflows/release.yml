# Kontrol Merkezi — kurulabilir paketlerin üretimi (ADR 0023).
#
# ÇAPRAZ DERLEME YOKTUR: her paket kendi platformunda üretilir. Geliştirme
# makinesi Linux'tur, orada .exe/.msi/.dmg çıkmaz; bu iş akışı üç koşucuyu
# yan yana çalıştırır ve her biri kendi platformunun paketini derler.
#
# Mantık BURADA YAZILMAZ, ÇAĞRILIR: adımların sırası `scripts/build-release.sh`
# ve `scripts/build-release.ps1` içindedir. Bu dosya yalnız koşucuyu hazırlar
# (Rust, Tauri CLI, sistem paketleri, önbellek) ve betiği çağırır. İkinci bir
# derleme reçetesi tutmak, iki reçetenin ayrışması demektir.

name: Paket üretimi

on:
  # Elle tetikleme: Actions → "Paket üretimi" → Run workflow.
  workflow_dispatch:
  # Yayın etiketi: v0.1.0, v0.2.0 ...
  push:
    tags:
      - "v*"

# `main`'e her push'ta DERLEME YOK. Bu depo bir masaüstü uygulamasıdır; her
# commit'te üç platformu derlemek 3 × ~20 dakika koşucu zamanı harcar ve
# kimsenin indirmeyeceği paketler üretir. Paket, elle ya da etiketle istenir.

permissions:
  contents: read

concurrency:
  group: paket-${{ github.ref }}
  cancel-in-progress: true

env:
  # pip'in indirme önbelleği üç platformda da depo içinde aynı yere düşsün ki
  # tek bir cache adımı yetsin. Gömülü Python'un pip'i de bu değişkeni okur.
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  CARGO_TERM_COLOR: always
  # ÜÇ KOŞUCUDA DA PYTHON UTF-8 KONUŞUR. Windows koşucusunun konsolu cp1252'dir;
  # Python çıktısını oraya kodlayamayınca UnicodeEncodeError atar ve derleme
  # düşer (run 32038408984 — `→` cp1252'de yok, Türkçe harfler de).
  # `tools/build-ui-registry.py` kendi çıktısını zaten sabitliyor; bu iki
  # değişken aynı güvenceyi ÇAĞRILAN her Python'a yayar (pip, toplayıcı, sonra
  # eklenecek adımlar) ki düzeltme tek betikte kalmasın.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: ${{ matrix.platform }} paketi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # Bir platformun derlemesi patlarsa diğer ikisi yine tamamlansın:
      # elde en az iki paket kalır ve hata tek platforma özgü mü, ortak mı
      # görülür.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            bundles: deb,appimage
          # İLK TURDA YALNIZ NSIS. İstenen teslimat `-setup.exe`, yani NSIS
          # kurucusudur; MSI onun yanında ikinci bir pakettir, alternatifi
          # değil. MSI şu an iki ek risk taşıyor: Tauri CLI WiX'i koşuda
          # İNDİRİYOR (ağ hatası tüm işi düşürür) ve MSI kaynak ağacına
          # gömülü ~100 MB Python'u ikinci kez paketlemek süreyi ve bellek
          # kullanımını belirgin biçimde artırıyor. İkisi de .exe'yi bugün
          # eline almakla ilgisiz nedenlerle işi düşürebilir.
          #
          # MSI İKİNCİ TURDA GERİ KONUR: `bundles: nsis,msi` yazmak yeter,
          # betikler ve `tauri.conf.json` → bundle.targets zaten hazır.
          - os: windows-latest
            platform: windows
            bundles: nsis
          # macos-latest arm64'tür (Apple Silicon); üretilen .dmg de arm64
          # olur. Intel Mac gerekirse ayrı bir matris satırı (macos-13) açılır.
          - os: macos-latest
            platform: macos
            bundles: dmg

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      # Derleme bağımlılıkları. LİSTE BURAYA ELLE YAZILMAZ, TÜRETİLİR: tek kaynak
      # `deploy/packaging/system-packages.yaml`.
      #
      # Neden: liste burada elle kopyalanmıştı ve `desktop` grubuyla "AYNIDIR"
      # deniyordu — ama yalnız o grup kopyalanmıştı. `printer` grubundaki
      # `libcups2-dev` koşucuya hiç kurulmadı ve gömülü ortama pycups derlenirken
      # düştü (run 32038408984: "fatal error: 'cups/http.h' file not found").
      # İki listenin ayrışması kaçınılmazdı; artık tek liste var.
      #
      # Ne kurulur:
      #   - `desktop` grubunun tamamı — Tauri kabuğunu derlemek için.
      #   - HER gruptaki `-dev` paketleri — gömülü Python'a kurulan C uzantıları
      #     bu başlıklara karşı derlenir (pycups → libcups2-dev).
      # Ne kurulmaz: sürücüler, sunucular, istemciler (hplip, cups, mariadb-client…)
      # ve `optional:` girdileri. Koşucuda çalıştırılmıyorlar, yalnız derleniyor.
      - name: Sistem bağımlılıkları (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Manifesti okuyacak olan bu; koşucu imajında bulunduğu varsayılmaz.
          sudo apt-get install -y --no-install-recommends python3-yaml

          cat > "$RUNNER_TEMP/km-apt-packages.py" <<'PY'
          import sys

          import yaml

          MANIFEST = "deploy/packaging/system-packages.yaml"
          groups = yaml.safe_load(open(MANIFEST, encoding="utf-8")) or {}

          wanted: list[str] = []
          for name, group in groups.items():
              for package in (group or {}).get("packages") or []:
                  if name != "desktop" and not package.endswith("-dev"):
                      continue
                  if package not in wanted:
                      wanted.append(package)

          if "desktop" not in groups:
              sys.exit(f"{MANIFEST}: 'desktop' grubu yok — dosya yeniden mi düzenlendi?")
          if not wanted:
              sys.exit(f"{MANIFEST}: hiç paket çıkmadı.")
          print(" ".join(wanted))
          PY

          PACKAGES="$(python3 "$RUNNER_TEMP/km-apt-packages.py")"
          echo "system-packages.yaml'dan türetildi: $PACKAGES"
          # Bölünmesi İSTENİYOR: tek dizgede boşlukla ayrılmış paket adları.
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES

      # ÜÇÜNCÜ PARTİ EYLEM KULLANILMIYOR — NEDENİ ÖLÇÜLDÜ.
      #
      # Burada `dtolnay/rust-toolchain@stable` ve `Swatinem/rust-cache@v2`
      # duruyordu. Doğrulama koşusunda (run 32042258828) Windows işi İKİ KEZ
      # ÜST ÜSTE daha "Set up job" adımında düştü:
      #
      #   Failed to download archive 'https://codeload.github.com/...'
      #   after 3 attempts. — 429 (Too Many Requests)
      #
      # `actions/*` dışındaki her eylem koşuya codeload.github.com'dan zip
      # olarak indirilir ve o uç nokta hız sınırı uyguluyor. İş `cargo tauri
      # build`e HİÇ ULAŞMADI: derlemeyle, kodumuzla, platformla ilgisi yok —
      # bir indirme kotasına takıldık. Yeniden denemek çözüm değil, aynı
      # kotaya yeniden girmektir.
      #
      # Bu yüzden zincirdeki iki üçüncü parti eylem kaldırıldı: araç zinciri
      # kabuk komutuyla, önbellek `actions/cache@v4` ile kuruluyor. `actions/*`
      # eylemleri GitHub'ın kendi dağıtımından gelir ve bu vektöre girmez.
      # Karşılığında kaybedilen tek şey rust-cache'in akıllı budaması; onun
      # yerine anahtar `Cargo.lock` özetine bağlandı.
      #
      # GERİ ALINMASI: eylemler geri konursa 429 riski de geri gelir. Bugün
      # kaldırıldılar çünkü teslim edilecek bir .exe vardı ve iş akışı onu
      # üretemiyordu.
      - name: Rust araç zinciri
        shell: bash
        run: |
          # GitHub'ın ubuntu/windows/macos imajlarında rustup ZATEN kuruludur;
          # aşağısı kuruluysa saniyeler sürer, değilse toolchain'i kurar.
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup koşucuda yok — koşucu imajı değişmiş olabilir."
            exit 1
          fi
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # Cargo kayıt defteri + target/ önbelleği. Soğuk derleme ~20 dakika;
      # önbellek ısındığında birkaç dakikaya iner.
      #
      # `cargo-tauri*` de saklanıyor: aşağıdaki "Tauri CLI" adımı ikili
      # önbellekten geldiyse yeniden derlemiyor (tek başına ~5 dakika).
      #
      # ÖNBELLEK İSTEĞE BAĞLIDIR. `continue-on-error` bilinçli: önbellek bir
      # hızlandırmadır, derlemenin ön koşulu değil. Sunucu tarafında bir sorun
      # olursa derleme yavaşlar, DÜŞMEZ — 429'dan çıkardığımız ders bu.
      - name: Rust önbelleği
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri*
            apps/desktop/src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      # Betikler `cargo tauri` yoksa anlaşılır hatayla durur; koşucuda yok,
      # kurulur. Önbellekten geldiyse yeniden derlenmesin diye önce bakılır.
      - name: Tauri CLI
        shell: bash
        run: |
          if cargo tauri --version >/dev/null 2>&1; then
            echo "önbellekten: $(cargo tauri --version)"
          else
            cargo install tauri-cli --version "^2" --locked
          fi

      # Gömülü Python'a kurulan bağımlılıklar her koşuda yeniden indirilmesin.
      # Anahtar bağımlılık kaynaklarının özetidir (K11: liste pyproject.toml ve
      # modül manifestlerinden türetilir, elle yazılmaz).
      - name: pip önbelleği
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ matrix.platform }}-${{ hashFiles('backend/pyproject.toml', 'modules/*/module.yaml') }}
          restore-keys: |
            pip-${{ matrix.platform }}-

      # İKİ AYRI İMZA, KARIŞTIRILMAZ.
      #
      #  · KOD İMZALAMA YOK: sertifika alınmadı (ADR 0023 §5). Kurucu imzasız
      #    çıkar ve Windows'ta SmartScreen uyarısı verir; nasıl geçileceği
      #    deploy/README.md içinde yazılıdır. Buraya kod imzalama adımı
      #    eklenmez — sertifika kararı verildiğinde ADR güncellenir.
      #
      #  · GÜNCELLEME İMZASI VAR: aşağıdaki iki değişken. Bu, işletim sistemine
      #    "bu yazılıma güven" demez; kurulu uygulamaya "indirdiğin paket
      #    gerçekten bizden geldi" dedirtir. Anahtar olmadan güncelleyici hiçbir
      #    paketi kabul etmez — imzasız güncelleme diye bir şey yoktur.
      #
      # ANAHTAR DEPODA DURMAZ (K8): GitHub Secrets'tan gelir. Tanımlı değilse
      # paketler imzasız üretilir, `dist/updater/` künyesi hiç yazılmaz ve
      # aşağıdaki `latest.json` adımı bunu açık bir hatayla söyler — sessizce
      # güncellenemeyen bir sürüm yayınlanmaz.
      # macOS KOD İMZASI VE NOTARIZATION — GÜNCELLEME İMZASINDAN AYRI ŞEY.
      #
      # `TAURI_SIGNING_*` güncelleyicinin paketi doğrulaması içindir; aşağıdaki
      # `APPLE_*` değişkenleri Apple'ın Gatekeeper'ı içindir. İkincisi olmadan
      # kurulan uygulama "bu uygulama hasar görmüş" der ve HİÇ AÇILMAZ —
      # karantina özniteliği elle silinmedikçe (ADR 0023 §5 eki).
      #
      # SECRETS TANIMLI DEĞİLSE İMZALAMA SESSİZCE ATLANIR: Tauri bu değişkenler
      # boşken imzalamayı denemez ve derleme düşmez. Böylece sertifikası
      # olmayan bir çatal (fork) da paket üretebilir; yalnız o paket Gatekeeper
      # uyarısı verir.
      - name: Paketle (Linux / macOS)
        if: matrix.platform != 'windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # `bash ...` bilerek: betiğin çalıştırma bitine bağlı kalmasın.
        run: bash scripts/build-release.sh --bundles ${{ matrix.bundles }}

      - name: Paketle (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./scripts/build-release.ps1 -Bundles '${{ matrix.bundles }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Betik çıktıyı dist/ altına topluyor; koşucu silinmeden önce alınır.
      - name: Artefaktı yükle
        uses: actions/upload-artifact@v4
        with:
          name: kontrol-merkezi-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Yalnız `v*` etiketiyle koşulduğunda: üç platformun artefaktı tek Release'e
  # asılır. Elle tetiklemede bu iş atlanır, paketler Actions çalıştırmasının
  # artefakt listesinde durur.
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `make-latest-json.py` için gerekli; artefaktlar depo olmadan da inerdi
      # ama sürüm listesini üreten betik depoda duruyor.
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Artefaktları indir
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Dosyaları listele
        run: ls -lhR dist

      # `dist/*` yalnız DOSYALARI alır; `dist/updater/` klasörü (güncelleme
      # künyeleri) yayına girmez — o, bir sonraki adımın iç verisidir.
      - name: Release'e ekle
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Kurulabilir paketler (ADR 0023).

            | Platform | Dosya |
            |---|---|
            | Windows | `*-setup.exe` (NSIS) |
            | Linux | `*.deb`, `*.AppImage` |
            | macOS | `*.dmg` (arm64) |

            MSI bu turda üretilmiyor (iş akışı matrisindeki gerekçe).

            **Otomatik güncelleme:** kurulu uygulama Sistem Ayarları →
            Güncelleme sekmesinden bu yayına bakar ve kendi platformunun
            paketini indirir (`latest.json`). Yanındaki `*.sig` dosyaları
            paketlerin imzasıdır; uygulama imzayı doğrulamadan hiçbir paketi
            kurmaz. Kurulum her zaman kullanıcının onayıyla ve yeniden
            başlatmayla olur.

            Kurucular **kod imzalı değildir** — kod imzalama sertifikası
            alınmadı (yukarıdaki `.sig` başka bir şeydir). Windows'ta
            SmartScreen uyarısının nasıl geçileceği `deploy/README.md`
            içinde yazılıdır.

      # SÜRÜM LİSTESİ EN SONA KALIR: paketlerin yayındaki adresi ancak
      # yüklendikten sonra bellidir. GitHub varlık adlarındaki boşlukları
      # noktaya çevirdiği için adres tahmin edilmez, varlık listesinden okunur
      # — tahmin edilseydi bağlantı ilk indirmede 404 verirdi.
      - name: latest.json üret ve yayına ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 scripts/make-latest-json.py \
            --dist dist \
            --assets "$RUNNER_TEMP/release.json" \
            --version "${TAG#v}" \
            --out "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
