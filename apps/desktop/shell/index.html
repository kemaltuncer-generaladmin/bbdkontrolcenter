<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontrol Merkezi</title>
  <!-- İlk boyadan önce tema/platform (ADR 0032). Modül değil, eşzamanlı. -->
  <script src="boot.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Klavye kullanıcısı menüyü atlayıp doğrudan ekrana geçebilsin (WCAG 2.4.1). -->
  <a class="skip-link" href="#panel-body">Ekran içeriğine geç</a>

  <!-- Giriş. Kullanıcı adı sorulmaz: PIN kimliği belirler
       (docs/identity-model.md — Giriş akışı). Klavyeyle kullanılır.

       ADR 0016 (şifreyle giriş) REDDEDİLDİ: ekran PIN tuş takımıdır, metin
       alanı yoktur. Hane noktaları yalnız KAÇ hane girildiğini gösterir. -->
  <section class="login" id="login" data-km-drag hidden>
    <div class="aurora" aria-hidden="true"></div>

    <div class="login-card">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="mark-ring" cx="24" cy="24" r="19" />
        <circle class="mark-arc" cx="24" cy="24" r="19" />
        <circle class="mark-core" cx="24" cy="24" r="5.5" />
      </svg>
      <h1>Kontrol Merkezi</h1>
      <p class="org">Benim Dünyam Şirketler Grubu</p>

      <div class="slots" id="slots" role="img" aria-label="Girilen hane sayısı: 0"></div>
      <p class="error" id="error" role="alert" aria-live="assertive"></p>
      <p class="login-hint" id="login-hint">PIN'inizi yazın, <kbd>Enter</kbd> ile girin</p>
    </div>
  </section>

  <!-- Çalışma alanı: solda menü, sağda modül paneli. -->
  <div class="workspace" id="workspace" hidden>

    <aside class="sidebar">
      <div class="sidebar-brand" data-km-drag>
        <svg class="mark mark-sm" viewBox="0 0 48 48" aria-hidden="true">
          <circle class="mark-ring" cx="24" cy="24" r="19" />
          <circle class="mark-arc" cx="24" cy="24" r="19" />
          <circle class="mark-core" cx="24" cy="24" r="5.5" />
        </svg>
        <span>Kontrol Merkezi</span>
      </div>

      <div class="sidebar-search">
        <label class="visually-hidden" for="filter">Ekran ara</label>
        <input id="filter" type="search" placeholder="Ara" autocomplete="off" spellcheck="false">
      </div>

      <nav class="nav" id="nav" aria-label="Ekranlar"></nav>

      <div class="sidebar-foot">
        <kbd>↑</kbd><kbd>↓</kbd> gez · <kbd>/</kbd> öğrenci ara
      </div>
    </aside>

    <main class="panel">
      <header class="panel-head" data-km-drag>
        <div class="panel-head-text">
          <span class="crumb" id="crumb"></span>
          <h2 class="panel-title" id="panel-title"></h2>
        </div>
        <!-- KÜRESEL ARAMA (ADR 0031): her ekrandan `/` ile öğrenci, telefon,
             kantin kartı ya da ekran. Combobox + listbox deseni. -->
        <div class="gsearch" role="search">
          <label class="visually-hidden" for="gsearch-input">Öğrenci, veli telefonu, kantin kartı ya da ekran ara</label>
          <input id="gsearch-input" type="search" role="combobox" aria-autocomplete="list"
                 aria-expanded="false" aria-controls="gsearch-list" aria-describedby="gsearch-key"
                 placeholder="Öğrenci, telefon, kart ya da ekran ara" autocomplete="off" spellcheck="false" disabled>
          <kbd class="gsearch-key" id="gsearch-key" aria-label="Kısayol: Ctrl+K ya da eğik çizgi">Ctrl K</kbd>
          <div class="gsearch-pop" id="gsearch-pop" hidden>
            <ul class="gsearch-list" id="gsearch-list" role="listbox" aria-label="Arama sonuçları"></ul>
            <p class="gsearch-status" id="gsearch-status" role="status" aria-live="polite"></p>
          </div>
        </div>
      </header>
      <!-- Panel gövdesi bilinçli olarak boş: modüller aşama aşama gelecek. -->
      <div class="panel-body" id="panel-body" tabindex="-1"></div>
    </main>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
