[package]
name = "kontrol-merkezi"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Kontrol Merkezi masaüstü kabuğu"
publish = false

# Bağımlılık ilan edilir, kopyalanmaz (K11 — ADR 0008).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
