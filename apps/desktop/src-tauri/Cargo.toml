[package]
name = "kontrol-merkezi"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Kontrol Merkezi masaüstü kabuğu"
publish = false

# Bağımlılık ilan edilir, kopyalanmaz (K11 — ADR 0008).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `generate_context!` KAPASİTE VARSA serde_json'a genişliyor: ACL verisi
# ikiliye `serde_json::Value` olarak gömülüyor. `capabilities/` klasörü
# açıldığı an derleme "cannot find serde_json" diyerek durur — bağımlılık bu
# yüzden burada ilan edilir (K11), gövdede elle kullanılmasa da.
serde_json = "1"
# Kendi kendini güncelleme (GitHub Releases + imzalı paket). Eklentinin npm
# tarafı KULLANILMAZ: kabukta paketleyici yok, `shell/` düz ES modülü olarak
# servis ediliyor ve `import` edilecek bir bağımlılık ağacı bulunmuyor. Akış
# bu yüzden `src/main.rs` içinde `#[tauri::command]` olarak durur, arayüz de
# ona `invoke` ile ulaşır.
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
