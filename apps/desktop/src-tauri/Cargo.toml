[package]
name = "kontrol-merkezi"
version = "0.6.3"
edition = "2021"
rust-version = "1.77.2"
description = "Kontrol Merkezi masaüstü kabuğu"
publish = false

# Bağımlılık ilan edilir, kopyalanmaz (K11 — ADR 0008).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `generate_context!` KAPASİTE VARSA serde_json'a genişliyor: ACL verisi
# ikiliye `serde_json::Value` olarak gömülüyor. `capabilities/` klasörü
# açıldığı an derleme "cannot find serde_json" diyerek durur — bağımlılık bu
# yüzden burada ilan edilir (K11), gövdede elle kullanılmasa da.
serde_json = "1"
# Yerel yazdırma: PDF baytları kabuğa base64 ile geliyor (bkz. src/printing.rs).
base64 = "0.22"
# Kendi kendini güncelleme (GitHub Releases + imzalı paket). Eklentinin npm
# tarafı KULLANILMAZ: kabukta paketleyici yok, `shell/` düz ES modülü olarak
# servis ediliyor ve `import` edilecek bir bağımlılık ağacı bulunmuyor. Akış
# bu yüzden `src/main.rs` içinde `#[tauri::command]` olarak durur, arayüz de
# ona `invoke` ile ulaşır.
tauri-plugin-updater = "2"
# KM Sunucu `https://` konuşuyor ve TLS elde yazılmaz. Eski `core_request`
# ham TCP üzerinden HTTP/1.1 yazıyordu; yerel ve şifresiz bir istek için
# yeterliydi, uzak sunucu için değil. `reqwest` zaten bağımlılık ağacında —
# `tauri-plugin-updater` onu getiriyor — burada açıkça ilan edilir (K11).
#
# `rustls-tls`: sistemin OpenSSL'ine bağlanmamak için. Windows ve macOS
# derlemelerinde OpenSSL aramak, CI'da çözülmesi en zahmetli hatalardan biri.
#
# `gzip`: sunucu büyük JSON yanıtlarını sıkıştırıyor (`GZipMiddleware`); bu
# özellik olmadan reqwest `Accept-Encoding` göndermez ve yanıt ham gelir.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "gzip"] }
# Native his (ADR 0032). Dördü de resmî Tauri eklentisi; JS tarafları
# KULLANILMAZ (paketleyici yok) — kabuk onlara kendi `#[tauri::command]`
# sarmalayıcılarıyla ulaşır, bu yüzden `capabilities/` altında eklentilerin
# JS komutlarına hiçbir izin AÇILMAZ (en az izin).
#
# window-state: pencere boyutu/konumu/ekranı/tam ekran durumu hatırlanır.
tauri-plugin-window-state = "2"
# single-instance: ikinci açılış yeni pencere açmaz, mevcut pencereyi öne getirir.
tauri-plugin-single-instance = "2"
# notification: işletim sisteminin bildirim merkezi (`kit.notify`).
tauri-plugin-notification = "2"
# dialog: yerel dosya aç/kaydet pencereleri (`kit.openFile`, `kit.saveFile`).
tauri-plugin-dialog = "2"

# Windows 11 Mica yalnız derleme 22000+'da vardır; karar pencere kurulmadan
# sürüme bakılarak verilir (src/native.rs → `mica_supported`). Paket zaten
# bağımlılık ağacında (tao/window-vibrancy getiriyor) — burada ilan edilir (K11).
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
