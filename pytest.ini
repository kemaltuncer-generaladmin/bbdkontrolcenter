# Testler depo kökünden çalıştırılır; pytest yapılandırması bu yüzden burada
# durur. backend/pyproject.toml içindekiler paketin kendi araç ayarlarıdır
# (ruff, mypy) — test ayarı orada tekrarlanmaz.
[pytest]
testpaths = tests modules
asyncio_mode = auto
addopts = -q

# Yalnız `test_*.py` toplanır — pytest'in varsayılanı `*_test.py` desenini de
# içerir ve bu, TÜM TAKIMI koşulamaz hâle getirmişti.
#
# `modules/bell/agent/uctan_uca_test.py` bir pytest testi değil, elle
# çalıştırılan uçtan uca betiktir; iki komut satırı argümanı alır
# (`<ev_dizini> <ajan_yolu>`) ve bunları MODÜL DÜZEYİNDE okur
# (`EV = Path(sys.argv[1])`). pytest onu içe aktardığı anda toplama
# `IndexError` ile çöküyor, tek test bile koşmuyordu (RC=2) — yani belgelenen
# `.venv/bin/python -m pytest` komutu hiç çalışmıyordu.
#
# Betiği pytest'e uydurmak yerine desen daraltıldı: depodaki 96 test dosyasının
# hepsi zaten `test_*.py`, `*_test.py` kullanan TEK dosya o betik. Betik de
# kendi kullanımını sürdürüyor.
python_files = test_*.py
