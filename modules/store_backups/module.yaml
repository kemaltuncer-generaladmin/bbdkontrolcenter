# Manuel Yedekleme modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_backups
name: "Manuel Yedekleme"
description: "Mağaza veritabanı ve dosyalarının elle yedeklenmesi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_backups
  router: backend.api.routes:router
  tags: ["store_backups"]
  requires: [store_backups.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Manuel Yedekleme"
    icon: archive
    group: "BBD Store"
    order: 190
    requires: [store_backups.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: store_backups.view
    description: "Manuel Yedekleme ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: store_backups.manage
    description: "Manuel Yedekleme kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
