# Manuel Yedekleme — mağaza verisinin elle yedeklenmesi ve geri yüklenmesi.
#
# Bu ekran mağaza verisine YALNIZ `store.api` yeteneğinden bakar (K4); ham
# httpx ya da DB sürücüsü kullanmaz. Yedek dosyaları mağazadadır ve buraya
# kopyalanmaz: yerel tablo yalnız NİYETİ ve GEREKÇEYİ tutar.
#
# DEPODAKİ EN YIKICI İŞLEM BURADA: geri yükleme mevcut veriyi değiştirir.
# Bu yüzden `store_backups.restore` ayrı bir anahtardır ve YALNIZ admin'e
# düşer; servis ayrıca önce güvenlik yedeği aldırır ve alınamazsa geri
# yüklemeyi hiç başlatmaz.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_backups
name: "Manuel Yedekleme"
description: "Mağaza veritabanı, dosyaları ve ayarlarının elle yedeklenmesi, doğrulanması ve geri yüklenmesi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: [store_api]

provides: []

consumes:
  - capability: store.api
    reason: "Mağaza verisi tek kapıdan geçer (K4); yedek uçları da oradadır."

events:
  publishes:
    - name: store.backup.created
      description: "Yeni yedek alındı. Yük: {name, scope, bytes, actor, dryRun}."
    - name: store.backup.restored
      description: "Yedek geri yüklendi — mağaza verisi değişti. Yük: {name, actor, safetyBackup}."
  subscribes: []

http:
  prefix: /api/store_backups
  router: backend.api.routes:router
  tags: ["store_backups"]
  requires: [store_backups.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Manuel Yedekleme"
    icon: archive
    group: "BBD Store / Sistem ve Kayıt"
    order: 380
    requires: [store_backups.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına bağlanacak,
# mağaza ekranları PIN istemiyor. Koruma dört katmanlı: ayrı izin anahtarı +
# gerekçe (>=10 karakter, backend'de de doğrulanır) + dryRun varsayılanı +
# geri yükleme öncesi zorunlu güvenlik yedeği.
permissions:
  - key: store_backups.view
    description: "Yedek envanterini, disk durumunu ve denetim izini görüntüleme, CSV alma."
    default_roles: [admin, bbd_staff]
  - key: store_backups.manage
    description: "Yeni yedek alma, sağlama toplamı doğrulama, yedeği yerel diske indirme."
    default_roles: [admin, bbd_staff]
  - key: store_backups.restore
    description: "Yedeği geri yükleme. Mevcut mağaza verisini değiştirir; yalnız yönetici."
    default_roles: [admin]
  - key: store_backups.delete
    description: "Eski yedek dosyasını silme (yalnız N günden eski, gerekçeyle)."
    default_roles: [admin]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
