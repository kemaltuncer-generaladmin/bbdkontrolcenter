timezone: Europe/Istanbul
enrollment_code_minutes: 10
# Tablet bu aralıklarla tek bir `sync` çağrısı yapar. Sunucu yük altındaysa
# büyütmek bütün tabletleri yavaşlatır; kod değişmez.
sync_active_seconds: 60
sync_idle_seconds: 300
