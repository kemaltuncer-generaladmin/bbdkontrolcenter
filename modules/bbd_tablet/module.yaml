id: bbd_tablet
name: "Öğrenci Tablet Yönetimi"
description: "Paylaşımlı okul tabletleri: profil, kullanım saatleri, uzaktan kilit ve komut, öğrenci ek süresi ve kısıtlaması, uygulama dağıtımı ve uzaktan güncelleme, silme ve geçmiş saklama."
version: 0.3.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register
depends: [bbd_canteen_api]
provides: []
consumes:
  - capability: canteen.api
    reason: "Öğrenci kimliği ve kiosk giriş kodu kantinde kalır."
events:
  publishes: []
  subscribes: []

http:
  prefix: /api/bbd_tablet
  router: backend.api.routes:router
  tags: ["bbd_tablet"]
  requires: [bbd_tablet.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Öğrenci Tablet Yönetimi"
    icon: tablet
    group: "BBD"
    order: 58
    requires: [bbd_tablet.view]

permissions:
  - key: bbd_tablet.view
    description: "Tabletleri, profilleri, oturumları, komutları, öğrenci kullanımını, ek süreleri ve kısıtlamaları görüntüleme."
    default_roles: [admin, bbd_staff, org_staff]
  - key: bbd_tablet.manage
    description: "Tablet, profil ve uygulama kurallarını düzenleme; tablet kilidi, duyuru, komut, oturum kapatma; APK yükleme ve dağıtma, indirme sırasını öne alma; tablet, profil, öğrenci tablet verisini silme ve dağıtımı bitirme (PIN ile)."
    default_roles: [admin, bbd_staff]
  - key: bbd_tablet.grant
    description: "Öğrenciye uygulama bazında günlük ek süre verme ve geri alma; öğrenciyi belirli bir zamana kadar tabletten kısıtlama; hatalı şifreyle kilitlenen tablet girişini açma."
    default_roles: [admin, bbd_staff, org_staff]

config:
  defaults: config/default.yaml
  schema: config/schema.json
migrations: backend/migrations
dependencies:
  python: []
  system: []
tasks: []
