# Elle Sipariş ekranı ayarları. Düz anahtarlar — iç içe `modules:` bloğu yoktur.

# KURU PROVA VARSAYILANI. İstemci `dryRun` alanını HİÇ göndermezse bu değer
# geçerlidir. KAPALI: açık kalsaydı panelden açılan HER sipariş sessizce bir
# provaya döner, ekran "sipariş açıldı" der, mutfakta hiçbir şey görünmez ve
# fark ancak müşteri yemeği bekleyip aradığında anlaşılırdı. Geçidin kendi
# varsayılanı (modules.bld_api.dry_run_default) da aynı sebeple kapalı
# olmalıdır; servis yine de HER çağrıda `dry_run=` değerini AÇIKÇA geçirir ve
# varsayılana güvenmez (bld_api/README.md).
#
# Uç `dryRun: true` KABUL ETMEYE DEVAM EDER: sözleşme §4 additive'dir ve
# panelin "önce prova et" düğmesi bu alanı kullanır. Provanın sınırı yazılıdır
# — gövdeyi ve ödeme yöntemini denetler, kalem geçerliliğini ve stoğu DENETLEMEZ.
dry_run_default: false

# Müşteri aramasının sayfa boyutu. Sözleşme tavanı 100 (`00-genel.md` §5).
# Yirmi satır telefonda okunacak kadar; personel doğru kaydı ilk ekranda
# görmezse aramayı daraltır, sayfa çevirmez.
customer_page_size: 20

# Aramanın açılması için gereken en az karakter. Sunucu iki karakter istiyor;
# üç seçilmesinin sebebi KVKK denetim izidir: her müşteri okuması BLD'de bir
# satır açıyor ve personel telefonu yazarken her tuşta bir istek çıkarsa iz,
# okunamaz bir gürültüye döner. Aşağı sınır 2, yukarı 6.
min_search_chars: 3
