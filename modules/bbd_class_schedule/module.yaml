# Ders Takvimi modülü
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md
#
# SALT OKUNUR AYNA. Bu ekran hiçbir şeyin sahibi değildir.
#
# 0.1'de haftalık saatlerin ve grupların sahibi burasıydı; zil sistemi onları
# `bbd_class_schedule.week` yeteneğinden okuyordu. 0.2'de yön TERSİNE ÇEVRİLDİ:
# sahip Zil Sistemi'dir, bu ekran `bell.week` yeteneğinden okuyup gösterir.
#
# Gerekçe: saatleri giren kişi zili kuran kişiyle aynı ve iki ekranda iki ayrı
# doğru kaynak tutmak, hangisinin geçerli olduğunu belirsiz kılıyordu.
#
# `depends: [bell]` ZORUNLU — ters yön hâlâ dursaydı çekirdek bağımlılık
# döngüsünü reddeder ve İKİ modül birden düşerdi.

id: bbd_class_schedule
name: "Ders Takvimi"
description: "Zil sistemine girilen haftalık saatlerin ve grupların salt okunur görünümü."
version: 0.3.0
sdk: ">=0.1,<1.0"
# KAPALI — 17.10.2026 (iş 69, kullanıcı: "ders programı girme kısmı çok karışık"). BBD menüsündeki
# "Ders Takvimi" adı, BBD Akademi › Ders programı (hafta takvimi) ile karışıyordu; içeriği (haftalık zil
# saatleri, salt okunur) Zil Sistemi ekranının kendisidir. Tek yerde toplandı: zil saatleri Zil Sistemi'nde,
# ders programı BBD Akademi'de. Kod ve göç yerinde durur; `enabled: true` geri açar.
enabled: false

# Alan servisi ve veri sınıfı (ADR 0033). Katalog: docs/architecture/domains.yaml
domain: bell
data_classification: internal

entrypoint: backend.module:register

depends: [bell]

# Bu modül artık hiçbir yetenek SAĞLAMAZ. Sağladığı `bbd_class_schedule.week`
# yeteneği kaldırıldı; tüketicisi (zil sistemi) artık kendi verisinin sahibi.
provides: []

consumes:
  # optional: Zil Sistemi silinse bile bu ekran ayakta kalır ve "kaynak yok"
  # der; boş ekran yerine nedenini gösterir (K7).
  - capability: bell.week
    optional: true
    reason: "Haftalık zil saatleri ve gruplar Zil Sistemi'nindir; buradan okunur (K3)."

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/bbd_class_schedule
  router: backend.api.routes:router
  tags: ["bbd_class_schedule"]
  requires: [bbd_class_schedule.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Ders Takvimi"
    icon: calendar
    group: "BBD"
    order: 10
    requires: [bbd_class_schedule.view]

# Katalog ve rol matrisi: docs/permissions.md
#
# `bbd_class_schedule.manage` KALDIRILDI. Ekranda değiştirilebilir hiçbir şey
# yok; düzenleme izni tanımlamak, olmayan bir kapıya anahtar dağıtmaktır.
#
# YETKİ DARALTMASI — 17.08.2026 kullanıcı kararı: "BLD personeli BBD ekranlarını
# da göremesin." `bld_staff` aşağıdaki anahtarların hiçbirinde YOKTUR; rolün BBD
# tarafında işi kalmadı. `admin`, `bbd_staff`, `org_staff` ve `accountant`
# DEĞİŞMEDİ.
#
# Manifesti daraltmak KURULU sistemde tek başına yetmez (`grant_defaults` yalnız
# ekler): var olan satırları `0009_bld_staff_bbd_ayrimi` göçü kaldırır.
# Bkz. docs/permissions.md → "Manifest'i daraltmak tek başına yetmez".
permissions:
  - key: bbd_class_schedule.view
    description: "Ders Takvimi ekranını görüntüleme."
    default_roles: [admin, bbd_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

# 001_groups.sql yerinde durur: uygulanmış bir göç geri alınmaz ve tablo
# başka bir modülün alanı değildir (K5). Artık okunmuyor, silinmiyor.
migrations: backend/migrations

tasks: []
