# Müşteriler modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_customers
name: "Müşteriler"
description: "Mağaza müşteri kayıtları, adresler ve sipariş geçmişi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_customers
  router: backend.api.routes:router
  tags: ["store_customers"]
  requires: [store_customers.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Müşteriler"
    icon: users
    group: "BBD Store"
    order: 80
    requires: [store_customers.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: store_customers.view
    description: "Müşteriler ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: store_customers.manage
    description: "Müşteriler kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
