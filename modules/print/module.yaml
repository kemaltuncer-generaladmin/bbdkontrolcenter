# Çıktı Merkezi — üretilen her raporun kaydı, önizlemesi ve yeniden baskısı.
# Şema: docs/schemas/module.schema.json · Karar: ADR 0019 (ve baskı yolu için 0014)
#
# NOT: Yazıcı donanımına erişim bu modüle ait DEĞİLDİR — km_platform/printer
# yeteneğidir (ADR 0006, tek kapı kuralı). Bu modül kaydı, arayüzü,
# yetkilendirmeyi ve yeniden basma akışını yönetir.
#
# KAYIT BU MODÜLÜN TABLOSU DEĞİLDİR. Yirmi modülün ortak çıktı kaydı
# `km_core/store` içindeki `outputs` tablosunda durur ve dosyayı yazan çekirdek
# fonksiyonunda doğar (ADR 0019 §1–2). Bu modül kapatılsa bile kayıt düşmeye
# devam eder; yalnız ekranı kaybolur.

id: print
name: "Çıktı Merkezi"
description: "Üretilen tüm rapor ve dışa aktarımların kaydı: liste, süzgeç, önizleme, yeniden baskı."
version: 0.2.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: []

consumes:
  - capability: printer
    optional: true
    reason: "Yeniden basma tek kapıdan geçer (ADR 0006/0014). Yetenek yoksa liste yine çalışır."

http:
  prefix: /api/print
  router: backend.api.routes:router
  tags: ["print"]
  requires: [print.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Çıktı Merkezi"
    icon: printer
    group: "Kurumsal"
    order: 830
    requires: [print.view]

# Katalog ve rol matrisi: docs/permissions.md
#
# ADR 0019 §6 izinleri `outputs.view` ve `outputs.reprint` diye adlandırıyor.
# Anahtarlar burada `print.` önekiyle yazıldı çünkü çekirdek manifest kapısı
# (`km_core/contracts/manifest.py`) izin anahtarının MODÜL KİMLİĞİYLE
# başlamasını şart koşuyor; `outputs.view` yazıldığında manifest reddedilir ve
# modül hiç yüklenmez. Anlam ADR'deki ile birebir aynıdır: görüntüleme ile
# yeniden basma AYRI izinlerdir. Adın gerçekten `outputs.*` olması modül
# kimliğinin değişmesini gerektirir; bu kapsam dışıdır ve ayrı bir karardır.
permissions:
  - key: print.view
    description: "Üretilmiş çıktıların listesini, önizlemesini ve baskı geçmişini görüntüleme."
    default_roles: [admin, org_staff, bld_staff, bbd_staff]
  - key: print.reprint
    description: "Üretilmiş bir çıktıyı yeniden yazıcıya gönderme."
    default_roles: [admin, org_staff, bld_staff, bbd_staff]

config:
  defaults: config/default.yaml
  schema: config/schema.json

tasks: []
