# Cari Hesap Yönetimi modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: bld_accounts
name: "Cari Hesap Yönetimi"
description: "Kurumsal cari hesaplar ve hesap hareketleri."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/bld_accounts
  router: backend.api.routes:router
  tags: ["bld_accounts"]
  requires: [bld_accounts.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Cari Hesap Yönetimi"
    icon: wallet
    group: "BLD"
    order: 590
    requires: [bld_accounts.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: bld_accounts.view
    description: "Cari Hesap Yönetimi ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: bld_accounts.manage
    description: "Cari Hesap Yönetimi kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
