# UDİT — İşlem Kayıtları.
#
# SALT OKUNUR EKRAN. Denetim kaydı iki kaynakta durur ve ikisi de bu modülün
# malı değildir: uzak `admin_api_audits` (mağaza) ve `mod_store_api_audit`
# (store_api geçidinin tablosu — `store.api` yeteneğinden OKUNUR, K4/K5).
# Modülün kendi tablosu yalnız DÖKÜM ALMA olayını tutar.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_udit_logs
name: "UDİT — İşlem Kayıtları"
description: "Mağaza denetim kayıtları: kim, neyi, neden değiştirdi — alan alan farkıyla."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: [store_api]

provides:
  - capability: store.audit.for
    contract: km_sdk.contracts:AuditTrailProvider
    description: "Bir kaydın işlem geçmişi — 19 panelin çekmecesindeki 'İşlem geçmişi' sekmesi."

consumes:
  - capability: store.api
    reason: "Denetim kaydı tek kapıdan geçer (K4): uzak admin_api_audits ve geçidin yerel izi."
  - capability: printer
    optional: true
    reason: "Denetim dökümü kâğıda basılır; yazıcı yoksa ekran çalışmaya devam eder."

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_udit_logs
  router: backend.api.routes:router
  tags: ["store_udit_logs"]
  requires: [store_udit_logs.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "UDİT — İşlem Kayıtları"
    icon: list
    group: "BBD Store"
    order: 160
    requires: [store_udit_logs.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına
# bağlanacak, mağaza ekranları PIN istemiyor.
permissions:
  - key: store_udit_logs.view
    description: "Denetim kayıtlarını görüntüleme, süzme ve fark tablosunu okuma."
    default_roles: [admin, bbd_staff, accountant]
  - key: store_udit_logs.export
    description: >-
      Denetim dökümü alma (PDF/CSV) ve yazdırma. Kaydı okumak ile kaydı
      binlerce satır hâlinde binadan çıkarmak aynı şey değildir: döküm personel
      adı ve IP taşır, ayrı anahtar ister ve iz bırakır.
    default_roles: [admin]
  - key: store_udit_logs.manage
    description: >-
      Sözleşme gereği ilan edilir ve HİÇBİR uç noktaya bağlı DEĞİLDİR. Bu ekran
      salt okunurdur: denetim kaydı silinemez, düzenlenemez. Bir uç bu anahtara
      bağlanırsa ekranın kalıcı notu yalana döner.
    default_roles: [admin]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

dependencies:
  python: []
  system: []
  capabilities_note: >-
    Yazdırma `printer` platform yeteneğinden, mağaza erişimi `store.api`
    modül yeteneğinden gelir; ikisi de `consumes` bloğunda ilan edilmiştir.
    PDF önizlemesi `pdftoppm` (poppler-utils) ister; yoksa rapor yine üretilir,
    yalnız önizleme görüntüsü çizilmez.

tasks: []
