# UDİT — İşlem Kayıtları modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_udit_logs
name: "UDİT — İşlem Kayıtları"
description: "UDİT işlem kayıtlarının görüntülenmesi ve dışa aktarımı."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_udit_logs
  router: backend.api.routes:router
  tags: ["store_udit_logs"]
  requires: [store_udit_logs.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "UDİT — İşlem Kayıtları"
    icon: list
    group: "BBD Store"
    order: 160
    requires: [store_udit_logs.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: store_udit_logs.view
    description: "UDİT — İşlem Kayıtları ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: store_udit_logs.manage
    description: "UDİT — İşlem Kayıtları kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
