# Sipariş Yönetimi modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: bld_orders
name: "Sipariş Yönetimi"
description: "Gelen siparişlerin görüntülenmesi ve durum ilerletme."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/bld_orders
  router: backend.api.routes:router
  tags: ["bld_orders"]
  requires: [bld_orders.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Sipariş Yönetimi"
    icon: clipboard
    group: "BLD"
    order: 510
    requires: [bld_orders.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: bld_orders.view
    description: "Sipariş Yönetimi ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: bld_orders.manage
    description: "Sipariş Yönetimi kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
