# Bildirimler modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: bld_notifications
name: "Bildirimler"
description: "Bildirim kuralları ve gönderim geçmişi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/bld_notifications
  router: backend.api.routes:router
  tags: ["bld_notifications"]
  requires: [bld_notifications.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Bildirimler"
    icon: megaphone
    group: "BLD"
    order: 160
    requires: [bld_notifications.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: bld_notifications.view
    description: "Bildirimler ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: bld_notifications.manage
    description: "Bildirimler kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
