# Kargo Yönetimi modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_shipping
name: "Kargo Yönetimi"
description: "Gönderi oluşturma, etiket alma ve kargo takibi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_shipping
  router: backend.api.routes:router
  tags: ["store_shipping"]
  requires: [store_shipping.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Kargo Yönetimi"
    icon: truck
    group: "BBD Store"
    order: 100
    requires: [store_shipping.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: store_shipping.view
    description: "Kargo Yönetimi ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: store_shipping.manage
    description: "Kargo Yönetimi kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
