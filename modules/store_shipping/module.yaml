# Kargo Yönetimi — BBD Store gönderi, etiket ve taşıyıcı ekranı.
#
# Bu ekran mağaza verisine YALNIZ `store.api` yeteneğinden bakar (K4); ham
# httpx ya da DB sürücüsü kullanmaz. Gönderi, taşıyıcı ve desi→ücret matrisi
# mağazadadır (`bbd_shipping_carriers`, `bbd_shipping_desi_rates`) ve
# kopyalanmaz. Yerel tablolar yalnız mağazada KARŞILIĞI OLMAYAN dört şeyi
# tutar: yazma gerekçesi, il/ilçe→bölge eşlemesi, üretilen teslimat
# manifestoları ve bu ekranın görüntü tercihleri.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_shipping
name: "Kargo Yönetimi"
description: "Gönderi sihirbazı, toplu etiket, teslimat manifestosu, taşıyıcı ve desi ücretlendirmesi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

# Geçit bizden önce yüklenmeli: yükleme sırası alfabetik değil, bu alana göre
# kurulur.
depends: [store_api]

provides:
  - capability: store.shipment.byOrder
    contract: km_sdk.contracts:ShipmentLookup
    description: "Bir siparişin gönderileri ve son hareketleri — Siparişler, Talepler ve İadeler okur."

consumes:
  - capability: store.api
    reason: "Gönderi, taşıyıcı ve ücret verisi tek kapıdan geçer (K4)."
  - capability: printer
    optional: true
    reason: "Kargo etiketi ve teslimat manifestosu kâğıda basılır; yazıcı yoksa ekran çalışmaya devam eder."
  - capability: store.notify.send
    optional: true
    reason: "Satır eylemi 'Müşteriye bildirim'. Bildirim ekranı kapalıysa düğme gizlenir."

events:
  publishes:
    - name: store.shipment.created
      payload: "{orderId, shipmentId, carrier, dryRun}"
      description: "Gönderi taslağı bu ekrandan açıldı."
    - name: store.shipment.purchased
      payload: "{shipmentId, orderId, carrier, trackingNo, feeKurus, dryRun}"
      description: "Taşıyıcıdan etiket satın alındı — PARA HAREKETİDİR."
    - name: store.shipment.cancelled
      payload: "{shipmentId, orderId, reason, dryRun}"
      description: "Gönderi iptal edildi ya da iade gönderisine çevrildi."
  subscribes: []

http:
  prefix: /api/store_shipping
  router: backend.api.routes:router
  tags: ["store_shipping"]
  requires: [store_shipping.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Kargo Yönetimi"
    icon: truck
    group: "BBD Store"
    order: 30
    requires: [store_shipping.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına bağlanacak,
# mağaza ekranları PIN istemiyor. Koruma üç katmanlı: ayrı izin anahtarı +
# gerekçe (backend'de de doğrulanır) + dryRun varsayılanı.
#
# `accountant` BU EKRANI GÖRMEZ: kargo mali bir ekran değil, operasyon ekranıdır
# (docs/permissions.md — muhasebeye açık ekranlar: fatura, vergi, iade, rapor,
# UDİT). Kargo maliyeti mali tarafa raporla gider.
permissions:
  - key: store_shipping.view
    description: "Gönderi listesi, taşıyıcılar, performans ve rapor/etiket alma."
    default_roles: [admin, bbd_staff]
  - key: store_shipping.manage
    description: "Gönderi taslağı açma, senkron, adres düzeltme, taşıyıcı sınama."
    default_roles: [admin, bbd_staff]
  - key: store_shipping.purchase
    description: "Taşıyıcıdan etiket SATIN ALMA ve iade etiketi açma. PARA HARCAR; gerekçe en az 20 karakter."
    default_roles: [admin, bbd_staff]
  - key: store_shipping.cancel
    description: "Satın alınmış gönderiyi iptal etme. Ayrı anahtar: sonradan daraltılabilsin diye."
    default_roles: [admin, bbd_staff]
  - key: store_shipping.rates
    description: "Desi→ücret matrisi, ücretsiz kargo eşiği ve bölge tanımlarını yazma. Vitrindeki kargo ücretini değiştirir."
    default_roles: [admin]

config:
  defaults: config/default.yaml
  schema: config/schema.json

dependencies:
  python:
    # Toplu etiket sayfası TAŞIYICININ ürettiği gerçek etiket PDF'lerini
    # birleştirir (sahte barkod çizilmez). N sayfayı A4 4'lü ya da termal
    # 100×150 sayfaya yerleştirmek bir PDF kütüphanesi ister. İçe aktarma
    # TEMBELDİR: paket yoksa modül yine yüklenir, yalnız toplu etiket ucu
    # anlaşılır bir hata döner (K7).
    - "pypdf>=5.1"

migrations: backend/migrations

tasks: []
