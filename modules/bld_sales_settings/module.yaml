# Satış Ayarları — satışı açan, kapatan ve kurallarını belirleyen tek ekran.
#
# Bu ekran BLD verisine YALNIZ `bld.api` yeteneğinden bakar (K4); ham httpx ya
# da doğrudan DB sürücüsü kullanmaz. İmzalı `X-Control-Signature` başlığı, zaman
# penceresi, nonce hatırlama, oran sınırı ve `dry_run` taşıma geçidin işidir.
#
# UZAK VERİNİN KOPYASI TUTULMAZ: ayarlar `location_options`, kapalı günler
# `veykemtu_closed_days`, stok tavanları günlük menü kayıtlarındadır. Yerel
# tablolar yalnız üç şey içindir — yazma denemesinin izi, formun açıldığı
# andaki taban çizgisi ve ekran tercihi.
#
# Sözleşme: BLD/docs/control/settings.md (+ stok şeridi için menu.md
# `GET|PUT /days/{date}/stock`). Uçlar, alan adları ve sınırlar orada sabittir;
# uydurma alan eklenmez.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: bld_sales_settings
name: "Satış Ayarları"
description: "Sipariş anahtarı, kesim saati, minimum tutar ve teslimat ücreti."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

# Geçit bizden önce yüklenmeli: yükleme sırası alfabetik değil, bu alana göre
# kurulur. `bld_api` BLD'nin kontrol uçlarına tek kapıdır (K4).
depends: [bld_api]

provides: []

consumes:
  - capability: bld.api
    reason: >
      Satış ayarları, kapalı günler ve günlük stok tavanları BLD sunucusundadır
      (docs/control/settings.md ve menu.md) ve oraya yalnız geçitten gidilir
      (K4). İmza, nonce, zaman penceresi ve oran sınırı tek yerde durur; her
      ekranın kendi istemcisini yazması aynı hatayı yirmi yerde tekrarlardı.

events:
  publishes:
    - name: bld_sales_settings.ordering_paused
      payload: "{until, reason, actor}"
      description: >
        Satış bu ekrandan DURDURULDU; müşteri artık sipariş veremez. Önizlemede
        YAYINLANMAZ — BLD'de hiçbir şey değişmedi.
    - name: bld_sales_settings.ordering_resumed
      payload: "{reason, actor}"
      description: "Satış yeniden açıldı. Önizlemede YAYINLANMAZ."
  subscribes: []

http:
  prefix: /api/bld_sales_settings
  router: backend.api.routes:router
  tags: ["bld_sales_settings"]
  requires: [bld_sales_settings.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Satış Ayarları"
    icon: sliders
    group: "BLD"
    order: 560
    requires: [bld_sales_settings.view]

# Katalog ve rol matrisi: docs/permissions.md
#
# DARALTILDI (kodlama başladı; iskeletteki "tüm rollere açık" geliştirme kuralı
# artık geçerli değil). Ekran satış kanalının kendisini yönetir: `bbd_staff`
# mağaza tarafındadır, `org_staff` zil/baskı/rehber ile sınırlıdır, `accountant`
# mali ekranlara bakar. Üçünün de burada işi yok.
#
# YIKICI İŞLEMLER PIN DEĞİL GEREKÇE İSTER (ADR 0012, `bld_kds` de bunu
# benimsemiş): ayrı izin anahtarı + gerekçe (>=10 karakter, backend'de de
# doğrulanır) + iki denetim satırı ("denendi" ve sonuç). Bu yüzden hiçbir izin
# `destructive: true` taşımaz — o bayrak çekirdekte PIN kapısına bağlanacak ve
# bu ekran PIN istemiyor.
permissions:
  - key: bld_sales_settings.view
    description: >
      Satış ayarlarını, kapalı günleri, günün stok tavanlarını ve bu ekranın
      yerel denetim izini görüntüleme.
    default_roles: [admin, bld_staff]
  - key: bld_sales_settings.manage
    description: >
      Satış KURALLARINI yazma: sabah kesim saati, ileri gün sınırı, minimum
      sepet tutarı, teslimat ücreti, ödeme yöntemleri, yoğunluk anahtarı ve
      müşteriye görünen metni, hazırlık / teslimat / yoğunluk dakikaları,
      günün menüsü rejimi, otomatik fatura
      belgesi ve günün hızlı stok tavanları. Ekran tercihi de burada, çünkü
      tercih tablosu kullanıcı başına değil kurulum başınadır.
    default_roles: [admin, bld_staff]
  - key: bld_sales_settings.ordering
    description: >
      SATIŞ KANALININ AÇIK/KAPALI olması: satışı durdurma ve açma, kapalı gün
      ekleme ve kaldırma. `manage` satış AÇIKKEN geçerli kuralları değiştirir
      ve yanlış girilen bir kesim saati bir dakikada düzeltilir; buradaki
      yetkinin hatası GERİ ALINAMAZ. Unutulan bir durdurma o günün bütün
      siparişlerini kaybettirir, yanlış eklenen bir kapalı gün abonelik
      üretimini atlatır (`SubscriptionGenerateCommand` o günü hiç işlemez) ve
      kaldırılan bir tatil mutfağı resmî tatilde üretime sokar. Kaybedilen gün
      geri gelmez. `busy` anahtarı BİLEREK bunun dışındadır: satışı kesmez,
      yalnız müşteriye "hazırlanması uzun sürebilir" uyarısı gösterir.
    default_roles: [admin, bld_staff]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

# Bağımlılık ilan edilir, kopyalanmaz (K11). Yeni PyPI paketi gerekmiyor: HTTP
# `bld.api` geçidinin işidir.
dependencies:
  python: []
  system: []
  capabilities_note: >
    BLD erişimi `bld.api` yeteneğinden gelir ve burada TEKRAR EDİLMEZ
    (consumes bloğunda ilan edilir). Bu ekran yazıcı, zamanlayıcı ya da SMS
    yeteneği kullanmaz.

tasks: []
