# Mobil Geçit — BBD Akademi API'sinin Kontrol Merkezi'ne açılan TEK kapısı.
#
# Bağlayıcı sözleşme: bbd-akademi deposu
#   docs/integrations/km-mobile-gateway.md (v1, "Ekler" dahil)
#   docs/integrations/kantin-veli-kontrolleri.md §2.2
#   docs/integrations/odeme-akademi-kaynagi.md "Ek" (payToken aktarımı)
#
# SUNUCUDAN SUNUCUYA: istemci bir insan değil, Akademi API'sidir. Kimlik
# ADR 0028'in servis anahtarıyla (`Authorization: Bearer kmsk_…`) gelir ve
# anahtarın bağlı olduğu KM kullanıcısının rollerinden izin alır. Bu modülün
# HER ucu `mobile_gateway.access` ister (K9); rol adı sorulmaz (K10).
#
# EKRANI YOKTUR: `ui` bloğu yok, menüde görünmez.
#
# VERİNİN SAHİBİ DEĞİLDİR. Öğrenci, kantin, tablet ve zil verisi kendi
# modüllerindedir; buradan yalnız yetenek üzerinden okunur/yazılır (K3, K5).
# Kendi tabloları yalnız şunlardır: idempotensi, hız sınırı/kilit sayaçları,
# OTP SMS kaydı (maskeli) ve denetim izi.

id: mobile_gateway
name: "Mobil Geçit"
description: "BBD Akademi API'sinin sunucudan sunucuya çağırdığı geçit: öğrenci dizini, kantin, tablet, anons, zil saatleri ve OTP SMS."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

# Zorunlu yeteneklerin sağlayıcıları bizden ÖNCE yüklenmeli: çekirdek zorunlu
# yeteneği yükleme anında arar (ARCHITECTURE §5/4). İsteğe bağlı yetenekler
# (tablet, zil) BİLEREK burada yok — onlar istek anında çözülür; sağlayıcısı
# düşse bile bu modül ayakta kalır ve ilgili uç 503 `capability_missing` döner.
depends: [bbd_canteen_api, bbd_students]

provides: []

consumes:
  - capability: secrets
    reason: "İdempotensi özetinin HMAC anahtarı kasada durur; gövdedeki şifre/OTP özetten geri bulunamasın (K8)."
  - capability: canteen.api
    reason: "Kantin bakiyesi, işlemler, veli kontrolleri, ödeme talepleri, nakit tahsilat, öğrenci şifresi doğrulama ve OTP SMS gönderimi kantindedir (K3)."
  - capability: bbd_students.directory
    reason: "Öğrenci dizini (ad, sınıf, telefonlar) ve kart QR metni Öğrenci Yönetimi'nindir (K3, K5)."
  - capability: bbd_tablet.read
    optional: true
    reason: "Tablet panosu ve öğrenci tablet kullanımı. Yoksa tablet uçları 503 capability_missing döner."
  - capability: bbd_tablet.control
    optional: true
    reason: "Ek süre, kısıtlama ve oturum kapatma. Yoksa denetim uçları 503 capability_missing döner."
  - capability: bell.week
    optional: true
    reason: "Haftalık zil saatleri Zil Sistemi'nindir. Yoksa yanıt available=false ile nedenini söyler."
  - capability: bell.announce
    optional: true
    reason: "Öğrenci çağırma anonsu Zil Sistemi'nin sesiyle yapılır. Yoksa çağırma ucu 503 capability_missing döner."

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/mobile_gateway/v1
  router: backend.api.routes:router
  tags: ["mobile_gateway"]
  requires: [mobile_gateway.access]

# `admin` da taşır: çekirdekte `admin` her ilan edilen izne sahiptir ve bunu
# `tests/core/test_rol_bld_staff.py` sınar. Asıl sahibi `mobile_service`
# rolüdür (servis anahtarının kullanıcısı — ADR 0028).
permissions:
  - key: mobile_gateway.access
    description: "Mobil geçidin bütün uçları: öğrenci dizini, kantin okuma/yazma, tablet denetimi, anons, zil saatleri, OTP SMS aktarımı. Servis anahtarı içindir."
    default_roles: [admin, mobile_service]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

dependencies:
  python: []
  system: []
  capabilities_note: "Kantin, öğrenci dizini, tablet ve zil erişimi consumes bloğundaki yeteneklerden geçer."

tasks: []
