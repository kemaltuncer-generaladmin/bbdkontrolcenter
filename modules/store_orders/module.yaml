# Siparişler — mağazanın günlük çalışma ekranı.
#
# Bu ekran mağaza verisine YALNIZ `store.api` yeteneğinden bakar (K4); ham httpx
# ya da DB sürücüsü kullanmaz. Bagisto verisinin kopyasını tutmaz: yerel tablolar
# sadece gerekçe (denetim izi), toplu işlem önizlemesi ve ekran tercihi içindir.
#
# NEDEN YENİ BİR EKRAN. Diğer 19 ekran yan menüde zaten kodlanmıştı; sipariş
# yoktu. Kargo, Fatura, İade ve Sanal POS siparişin ÇEVRESİNİ yönetiyor ama
# siparişin kendisini yöneten bir yer yoktu — "bugün hangi siparişler geldi"
# sorusunun tek bir cevabı olmuyordu. Menüde Kontrol Paneli'nin hemen ardına
# girer (order 15); mevcut ekranların sırası değişmez.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_orders
name: "Siparişler"
description: "Sipariş listesi, durum akışı, fatura ve kargo eylemleri."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

# Geçit bizden önce yüklenmeli: yükleme sırası alfabetik değil, bu alana göre
# kurulur. `store_api` mağazanın admin API'sine tek kapıdır (K4).
depends: [store_api]

provides:
  - capability: store.order.card
    contract: km_sdk.contracts:StoreOrderCard
    description: "Bir siparişin özet künyesi — Müşteriler ve Talepler ekranları okur. SALT OKUR."

consumes:
  - capability: store.api
    reason: >
      Sipariş verisi mağazanın admin API'sinden gelir (K4). Ödeme DURUMU
      siparişte yok: fatura listesi (`/invoices`) ve sanal POS denemeleri
      (`/bbd/payments/attempts`) aynı geçitten, tek sayfa isteğiyle okunur.
  - capability: store.shipment.byOrder
    optional: true
    reason: "Sipariş detayındaki kargo sekmesi; Kargo ekranı yoksa sekme hiç açılmaz (K7)."
  - capability: store.invoice.byOrder
    optional: true
    reason: "Sipariş detayındaki fatura sekmesi; Fatura ekranı yoksa sekme hiç açılmaz."
  - capability: store.audit.for
    optional: true
    reason: "Mağazanın kendi denetim kaydı; yoksa yalnız yerel gerekçe izi gösterilir."
  - capability: printer
    optional: true
    reason: "Sipariş fişi, kargo manifestosu ve liste raporu baskısı. Yazıcı yoksa ekran çalışır."

events:
  publishes:
    - name: store.order.status_changed
      payload: "{orderId, from, to, reason}"
      description: "Sipariş durumu bu ekrandan değiştirildi. Kuru provada YAYINLANMAZ."
  subscribes: []

http:
  prefix: /api/store_orders
  router: backend.api.routes:router
  tags: ["store_orders"]
  requires: [store_orders.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Siparişler"
    icon: cart
    group: "BBD Store"
    # 10 = Kontrol Paneli, 20 = Ürünler. Araya girer; mevcut ekranların
    # numaraları DEĞİŞMEZ — yan menü düzeni korunur.
    order: 15
    requires: [store_orders.view]

# Katalog ve rol matrisi: docs/permissions.md
# Yıkıcı işlemler PIN değil GEREKÇE ister (ADR 0012); bu yüzden hiçbir izin
# `destructive: true` taşımaz — o bayrak çekirdekte PIN kapısına bağlanacak ve
# mağaza ekranları PIN istemiyor. Koruma üç katmanlı: ayrı izin anahtarı +
# gerekçe (>=10 karakter, backend'de de doğrulanır) + dryRun varsayılanı.
permissions:
  - key: store_orders.view
    description: "Sipariş listesini, detayını, raporlarını ve CSV'sini görüntüleme."
    # `accountant` BİLEREK YOK: mali ekranlar store_invoices/store_tax/store_refunds/
    # store_reports/store_udit_logs'tur; sipariş işletme ekranıdır ve müşteri
    # iletişim bilgisi taşır.
    default_roles: [admin, bbd_staff]
  - key: store_orders.manage
    description: "Fatura kesme, gönderi kaydı açma, not ekleme, toplu işlem ve ekran ayarları."
    default_roles: [admin, bbd_staff]
  - key: store_orders.cancel
    description: "Sipariş iptali. Geri alınamaz; gerekçe ve süre penceresi denetlenir."
    default_roles: [admin, bbd_staff]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

# Bağımlılık ilan edilir, kopyalanmaz (K11). Yeni PyPI paketi gerekmiyor:
# HTTP `store.api` geçidinin, PDF üretimi çekirdeğin işi.
dependencies:
  python: []
  system:
    - poppler-utils        # `pdftoppm` — rapor önizlemesi. Yoksa rapor yine yazılır ve basılır.
  capabilities_note: >
    Yazdırma `printer` platform yeteneğinden, mağaza erişimi `store.api`
    yeteneğinden gelir; ikisi de burada TEKRAR EDİLMEZ (consumes bloğunda).

tasks: []
