# Durum Monitörü ekranı ayarları. Düz anahtarlar — iç içe `modules:` bloğu yoktur.

# KURU PROVA VARSAYILANI. İstemci `dryRun` alanını HİÇ göndermezse bu değer
# geçerlidir. KAPALI: açık kalsaydı panelden gönderilen HER düzeltme komutu
# sessizce provaya döner, ekran "gönderildi" der ve kasa hiçbir şey yapmazdı —
# fark ancak mutfak arayınca anlaşılırdı. Geçidin kendi varsayılanı
# (modules.bld_api.dry_run_default) da aynı sebeple kapalı olmalıdır; servis
# yine de HER çağrıda `dry_run=` değerini AÇIKÇA geçirir ve varsayılana
# güvenmez (bld_api/README.md).
#
# Uç `dryRun: true` KABUL ETMEYE DEVAM EDER: yıkıcı komutlarda ("kasayı
# yeniden başlat") panel önce prova çalıştırıp sunucunun ön denetimini
# geçtiğini görebilsin. Gerekçe zorunluluğu (10-160 karakter) DURUYOR: kuru
# prova bir güvenlik ağıdır, gerekçe ise denetim kaydıdır.
dry_run_default: false

# Özet yoklama aralığı (saniye). `00-genel.md` §2'deki bütçe hesabı bu ekran
# için `monitor/summary` ucunu 60 saniyede bir varsayıyor (saatte 60 istek) ve
# ekran TEK uç yokluyor: kutuları çizmek için gereken `devices` bloğu zaten
# özetin içinde geliyor. Kısaltmak paylaşılan `bld-control-panel` kovasını
# (3000/saat/IP) hızlandırılmış biçimde yakar ve ikinci bir yöneticinin
# ekranını 429'a düşürür. Sekme gizliyken yoklama zaten durur (kit `pollLoop`).
poll_seconds: 60

# Hata olayı listesinin sayfa boyutu varsayılanı. Sözleşme tavanı 100
# (`00-genel.md` §5); büyütmek yalnız tek isteğin gövdesini şişirir.
page_size: 25

# Olay geçmişi (zaman çizelgesi) ve yerel defter için varsayılan satır sayısı.
# Çizelge iki defteri birleştiriyor (gözlem + yazma izi); büyük bir sayı
# ekranda okunmaz bir duvar üretir, küçük bir sayı ise "dün ne olmuştu"
# sorusunu cevapsız bırakır.
history_limit: 60
