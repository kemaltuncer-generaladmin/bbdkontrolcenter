# Öğrenci Yönetimi modülü.
#
# KANTİN OTORİTEDİR. Öğrencinin adı, veli telefonu, harcama limiti, engel
# durumu ve bakiyesi kantindedir; bu modül onları canlı okur ve yalnızca
# kullanıcının dokunduğu alanı geri yazar (kasa tabletiyle çakışmaz).
#
# Kantinde KARŞILIĞI OLMAYAN alanlar (ad/soyad ayrımı, sınıf, okul no,
# öğrenci telefonu, ikinci veli, not) bu modülün kendi tablosundadır ve
# kantin `opaque_id` ile eşleşir. Kantin şemasına kolon EKLENMEZ.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: bbd_students
name: "Öğrenci Yönetimi"
description: "Kantin öğrencilerinin canlı yönetimi; sınıf ve iletişim bilgileri, kart QR üretimi."
version: 0.3.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: []

# İKİ AYRI YETENEK, İKİ AYRI KATMAN:
#   · `bbd_students.list` ARAYÜZ yeteneğidir — panelin `capabilities()`
#     fonksiyonu verir (ui/panel/index.js); öğrenci seçen paneller (ders
#     takvimi, öğle yemeği, toplu satış, SMS, raporlar) kullanır. Backend'de
#     KARŞILIĞI YOKTUR ve bilerek yoktur: o paneller veriyi kabukta ister.
#   · `bbd_students.directory` BACKEND yeteneğidir — `register()` içinde
#     `ctx.provide` ile deftere yazılır; sözleşme `backend/directory.py`
#     başlığında. Mobil geçit gibi sunucu tarafı tüketiciler içindir.
provides:
  - capability: bbd_students.list
    contract: km_sdk.contracts:StudentDirectory
    description: "ARAYÜZ: öğrenci özet listesi — grup kuran paneller için (ders takvimi)."
  # ÖĞRENCİ YÖNETİMİ BBD AKADEMİ'DE (13.10.2026, kullanıcı isteği). İki ARAYÜZ
  # yeteneği — backend karşılığı yoktur; panel `capabilities()` ile verir. BBD
  # Akademi paneli Öğrenciler bölümünü ve öğrenci kartının "Kayıt ve veliler"
  # sekmesini bunlarla çizer (K3). Veri ve uçlar bu modülde kalır.
  - capability: bbd_students.manager
    contract: bbd_students/ui/panel/index.js:createManager
    description: "ARAYÜZ: öğrenci listesi + toplu işlemler (sınıfa / gruba ata, seviye, kod, pasif) + gruplar."
  - capability: bbd_students.record
    contract: bbd_students/ui/panel/record.js:mountRecord
    description: "ARAYÜZ: tek öğrencinin KM kaydı — kimlik, ana sınıf ve gruplar, veliler, kantin, durum."
  # TEK GİRİŞ NOKTASI (0.5.3, ADR 0031). İki ARAYÜZ yeteneği daha:
  #   · `bbd_students.search` — kabuğun üst çubuğundaki küresel aramaya öğrenci
  #     sonuçları verir (adı `.search` ile biten yetenek; `GET /search`).
  #   · `bbd_students.open` — `(kantinId, {tab?})`: öğrencinin TEK KARTINI açar
  #     (BBD Akademi → Öğrenciler; Akademi yoksa bu modülün ekranı). Tablet,
  #     ödeme talebi gibi ekranlar öğrenci düzenlemek için bunu çağırır.
  - capability: bbd_students.search
    contract: bbd_students/ui/panel/index.js:capabilities
    description: "ARAYÜZ: küresel arama sağlayıcısı {label, search(metin, {limit})} — ad, okul no, veli telefonu, kantin kartı."
  - capability: bbd_students.open
    contract: bbd_students/ui/panel/index.js:capabilities
    description: "ARAYÜZ: (kantinId, {tab?}) → öğrencinin tek kartını açar (her ekrandan aynı bileşen)."
  - capability: bbd_students.directory
    contract: bbd_students/backend/directory.py:StudentDirectory
    description: >
      BACKEND: öğrenci dizini (mobil geçit sözleşmesi §1, §9). async
      list(since=None, *, balance=True) → {students, classes, complete, asOf,
      revision, removed (since ile)}; get(student_id, *, balance=True) →
      StudentRecord | None; get_many(ids, *, balance=True) → {students,
      missingIds} (≤ 100); removed_since(since) → [{id, at}];
      find_by_phone(phone10) → [StudentRecord]; card_qr_text(student_id) → str.
      StudentRecord accessCode TAŞIMAZ; seviye/alan/hedef sınav, status,
      statusReason, statusSince, revision, canteenSync dahildir. Dizin = kantin
      listesi ∪ kantine henüz yazılamamış profil (canteen: null); pasif görünür,
      silinen görünmez.
  # Öğrenci grupları ve TARİHLİ üyelik — tek sahibi bu modül (sözleşme
  # bbd-akademi/docs/integrations/km-ogrenci-gruplari-ve-zil.md §2.3).
  - capability: bbd_students.groups
    contract: bbd_students/backend/groups.py:StudentGroups
    description: >
      BACKEND: öğrenci grupları. async list(since_revision=None) → {revision, full,
      groups: [GroupRecord], complete}; get(group_id) → GroupRecord | None;
      for_student(student_id) → [{group, validFrom, validTo}];
      import_named(name, *, kind, call_name="", actor) → {id, created} (yalnız zil
      gruplarının taşınması; katlanmış ada göre idempotent). GroupRecord members
      bütün üyelik satırlarıdır (geçmiş dahil); tarihler yerel gün, iki uç dahil.
  # Kantinden gelen öğrenci olaylarının KM karşılığı (km-merkezi-senkron §6.2,
  # §6.3). Tüketici: Kantin Geçidi'nin olay alıcısı (profil tablosu yalnız bu
  # modülündür, K5).
  - capability: bbd_students.sync
    contract: bbd_students/backend/canteen_events.py:CanteenSync
    description: >
      BACKEND: async student_upserted(opaque_id, fields, *, created=False,
      causation_id=None, within=None) → "student.created" | "student.updated" |
      None (kasadan eklenen öğrenci → taslak profil; within aynı işlemin ilk
      adımı, False → tekrar); invalidate() dizin önbelleğini hemen bırakır;
      wake() uzlaştırmayı hemen koşturur.

consumes:
  - capability: canteen.api
    reason: "Öğrenciler kantinde durur; okuma ve yazma tek kapıdan geçer (K4)."
  - capability: events.outbox
    optional: true
    reason: "Öğrenci, veli, yaşam döngüsü ve grup olayları iş yazmasıyla aynı işlemde kalıcı outbox'a yazılır (ADR 0029). Platform yeteneğidir; yoksa olay yazılmaz, modül çalışır."
  - capability: bbd_tablet.control
    optional: true
    reason: "Pasifleştirmede tablet girişi süresiz kısıtlanır, yeniden etkinleştirmede kaldırılır (km-merkezi-senkron §5.2). Yoksa adım atlanır."
  - capability: akademi.student_finance
    optional: true
    reason: "Kalıcı silme ön koşulu: Akademi kurum cari borcu yok. Yetenek yoksa ya da Akademi'ye ulaşılamazsa silme kapalı kalır (503 akademi_unavailable)."
# NOT: `printer` (CUPS) yeteneği KASITLI OLARAK tüketilmiyor. ADR 0026
# sonrası sunucuda CUPS yok; baskı artık kullanıcının cihazında, çekirdeğin
# genel `/api/outputs/document` ucu + Tauri köprüsü üzerinden yapılıyor
# (bkz. bbd_canteen_reports/ui/panel/index.js — "Eskiden .../print
# çağrılıyordu... sunucuda CUPS kurulu değil" notu). Bu modül yalnızca
# `/preview` üretir; yazdırma adımı modüle özel bir uç gerektirmez.

# DIŞ OLAYLAR (km-merkezi-senkron §2.2) süreç içi yola değil, `events.outbox`
# platform yeteneğine yazılır: student.created|updated|deactivated|reactivated|
# deleted, guardian.linked|unlinked|phone_changed, canteen.controls_changed,
# tablet.policy_changed (pasifleştirme), group.changed. Aşağıdakiler KM içi.
events:
  publishes:
    - name: bbd_students.groups_changed
      description: >
        Öğrenci grupları ya da üyelikleri değişti. Yük {revision}: kalıcı grup
        revizyonu. Yazmanın hemen ardından yayınlanır; yayın patlarsa yazma tamamdır.
    - name: bbd_students.group_deleted
      description: >
        Arşivdeki bir sınıf KALICI silindi (göç 011). Yük {id, revision}. Zil o
        sınıfın planlı oturum çağrılarını iptal eder. `groups_changed` ayrıca yayınlanır.
  subscribes: []

http:
  prefix: /api/bbd_students
  router: backend.api.routes:router
  tags: ["bbd_students"]
  requires: [bbd_students.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Öğrenci Yönetimi"
    icon: graduation
    group: "BBD"
    order: 40
    requires: [bbd_students.view]
    # TEK GİRİŞ NOKTASI (0.5.3, kullanıcı isteği "iki çekirdek tek yere baksın";
    # ADR 0031): BBD Akademi paneli `bbd_akademi.students`ı verdiği sürece bu
    # ekran menüde ÇİZİLMEZ — öğrenci yönetimi BBD Akademi → Öğrenciler'dedir
    # (Akademi menüsü `bbd_students.view` taşıyana da görünür). Ekran kayıtta
    # kalır: yetenekleri yüklenir, eski derin bağlantılar Akademi'ye yönlenir.
    # BBD Akademi modülü kapatılırsa bu ekran menüye geri döner (K7).
    replacedBy: bbd_akademi.students

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık — BLD personeli
# hariç, bkz. aşağıdaki daraltma.
#
# YETKİ DARALTMASI — 17.08.2026 kullanıcı kararı: "BLD personeli BBD ekranlarını
# da göremesin." `bld_staff` aşağıdaki anahtarların hiçbirinde YOKTUR; rolün BBD
# tarafında işi kalmadı. `admin`, `bbd_staff`, `org_staff` ve `accountant`
# DEĞİŞMEDİ.
#
# Manifesti daraltmak KURULU sistemde tek başına yetmez (`grant_defaults` yalnız
# ekler): var olan satırları `0009_bld_staff_bbd_ayrimi` göçü kaldırır.
# Bkz. docs/permissions.md → "Manifest'i daraltmak tek başına yetmez".
permissions:
  - key: bbd_students.view
    description: "Öğrenci listesini ve bilgilerini görüntüleme."
    default_roles: [admin, bbd_staff, org_staff, accountant]
  - key: bbd_students.manage
    description: "Öğrenci ekleme ve bilgilerini düzenleme (kantine yazar)."
    default_roles: [admin, bbd_staff, org_staff, accountant]
  - key: bbd_students.qr
    description: "Öğrencinin kantin kart QR'ını ve toplu kart PDF'ini üretme."
    default_roles: [admin, bbd_staff, org_staff, accountant]
  # AYRI ANAHTAR: kod sıfırlamak öğrencinin kasaya girişini o an keser ve
  # velinin elindeki kodu öldürür. `manage` (ad/telefon düzeltme) taşıyan
  # herkesin bunu yapabilmesi gerekmiyor. `accountant` DIŞARIDA: muhasebenin
  # öğrenci girişini kesmek gibi bir işi yok.
  #
  # KAPSAM GENİŞLEDİ (toplu şifre listesi özelliği): aynı anahtar artık
  # tekli/toplu kod SIFIRLAMANIN yanı sıra mevcut kodları DEĞİŞTİRMEDEN
  # listeleme/önizleme/yazdırmayı da kapsıyor — ikisi de aynı sırrı (düz
  # giriş kodunu) açığa çıkarıyor, ayrı bir anahtar yalnızca karmaşıklık
  # eklerdi.
  - key: bbd_students.access_code
    description: "Öğrencinin 6 haneli kantin giriş kodunu görüntüleme (liste/PDF) ve sıfırlama."
    default_roles: [admin, bbd_staff, org_staff]
  # AYRI ANAHTAR: veli kantin kontrolleri (borç/günlük limit, kurum engeli,
  # veli engelini kaldırma, yasaklı ürünler) öğrencinin kasada alışveriş
  # yapıp yapamayacağını belirler. `manage` (ad/telefon) taşıyan herkesin işi
  # değil; `accountant` DIŞARIDA. Görüntülemek `view` ile serbest.
  - key: bbd_students.canteen_controls
    description: "Veli kantin kontrollerini (limitler, engeller, yasaklı ürünler) düzenleme."
    default_roles: [admin, bbd_staff, org_staff]

  # AYRI ANAHTAR: grup ve üyelik Akademi'de oturum ve yoklama listesini, zilde
  # grup çağrısını belirler. Okuma `view` ile serbest.
  - key: bbd_students.groups
    description: "Öğrenci gruplarını ve üyelikleri yönetme."
    default_roles: [admin, bbd_staff, org_staff]
  # AYRI ANAHTAR, VARSAYILAN YALNIZ admin (iş 30): arşivdeki sınıfı KALICI silmek
  # geri alınamaz — üyelikleri gider, Akademi'de sınıf listelerden kalkar (geçmiş
  # yoklama/oturum korunur), zil çağrıları iptal olur. Sınıfı arşivleyebilen
  # (`groups`) herkesin işi değil; ad yazılarak + gerekçe + PIN teyidi.
  - key: bbd_students.groups_delete
    description: "Arşivdeki sınıfı kalıcı silme (sınıfın adı yazılarak, gerekçe ve PIN teyidiyle; geri alınamaz)."
    destructive: true
    default_roles: [admin]

  # AYRI ANAHTAR: pasifleştirmek öğrencinin kantinini, tabletini ve BBD Akademi
  # girişini (ve yalnız ona bağlı velinin girişini) kapatır.
  - key: bbd_students.lifecycle
    description: "Öğrenciyi pasifleştirme (gerekçe, ileri tarih, toplu) ve yeniden etkinleştirme."
    default_roles: [admin, bbd_staff, org_staff]
  # AYRI ANAHTAR, VARSAYILAN YALNIZ admin: kalıcı silme geri alınamaz
  # (kantinde anonimleştirme, Akademi'de KVKK silme/anonimleştirme).
  - key: bbd_students.delete
    description: "Pasif öğrenciyi kalıcı silme — tek tek ya da toplu (bakiye 0, açık talep ve kurum cari borcu yok; ad ya da sayı yazılarak onay ve PIN teyidi). Kurum carisindeki alacak engellemez."
    destructive: true
    default_roles: [admin]

# Bağımlılık ilan edilir, depoya kopyalanmaz (K11 — ADR 0008).
dependencies:
  python:
    - "segno>=1.6"        # kart QR matrisi (saf Python, ikili bağımlılık yok)
    - "reportlab>=4.2"    # A4 kart sayfası
  system:
    # PDF'te Türkçe karakterler için gömülü TTF gerekir; dağıtımdan gelir.
    - "fonts-dejavu-core"

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
