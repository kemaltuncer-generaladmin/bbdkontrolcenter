# CMS — BBD Store vitrin metinleri.
#
# Bu ekran mağaza verisine YALNIZ `store.api` yeteneğinden bakar (K4); ham
# httpx ya da DB sürücüsü kullanmaz. Bagisto verisinin kopyasını tutmaz: yerel
# tablolar sadece gerekçe (denetim izi) ve SÜRÜM GEÇMİŞİ içindir — Bagisto
# CMS sayfasının eski hâlini tutmuyor.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_cms
name: "CMS"
description: "Mağaza sayfaları, yasal metinler, SSS, arama ve SEO (yönlendirme, arama terimleri, eş anlamlılar, site haritası)."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: [store_api]

provides: []

consumes:
  - capability: store.api
    reason: "Mağaza verisi tek kapıdan geçer (K4)."
  - capability: printer
    optional: true
    reason: "Yasal metin arşivi ve içerik envanteri kâğıda basılır; yazıcı yoksa ekran çalışmaya devam eder."

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_cms
  router: backend.api.routes:router
  tags: ["store_cms"]
  requires: [store_cms.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "CMS"
    icon: file_text
    group: "BBD Store"
    order: 60
    requires: [store_cms.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına bağlanacak,
# mağaza ekranları PIN istemiyor. Koruma üç katmanlı: ayrı izin anahtarı +
# gerekçe (>=10 karakter, backend'de de doğrulanır) + dryRun varsayılanı.
permissions:
  - key: store_cms.view
    description: "CMS ekranını görüntüleme, sürüm geçmişini okuma, rapor ve CSV alma."
    default_roles: [admin, bbd_staff]
  - key: store_cms.manage
    description: "Sayfa açma, içerik/SEO düzenleme, SSS sorularını yazma."
    default_roles: [admin, bbd_staff]
  - key: store_cms.restore
    description: "Sayfayı eski sürüme döndürme. Yürürlükteki metnin üstüne yazar."
    default_roles: [admin]
  - key: store_cms.redirects
    description: "301/302 yönlendirme yazma ve silme. Yanlış kayıt vitrini döngüye sokar."
    default_roles: [admin]
  - key: store_cms.sitemap
    description: "Site haritası tanımlama ve ÜRETME. Üretim 1.419 ürünü dolaşan ağır iştir ve vitrinde yayınlanan XML'i yeniden yazar."
    default_roles: [admin]

config:
  defaults: config/default.yaml
  schema: config/schema.json

dependencies:
  python: []
  system:
    - poppler-utils        # `pdftoppm` — rapor önizlemesi; yoksa rapor yine üretilir
  capabilities_note: "Mağaza erişimi ve yazıcı platform/modül yeteneğidir; consumes bloğunda ilan edilir, burada tekrar edilmez."

migrations: backend/migrations

tasks: []
