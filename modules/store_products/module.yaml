# Ürünler — BBD Store kataloğu.
#
# Bu ekran mağaza verisine YALNIZ `store.api` yeteneğinden bakar (K4); ham
# httpx ya da DB sürücüsü kullanmaz. Bagisto verisinin kopyasını tutmaz: yerel
# tablolar sadece gerekçe (denetim izi), toplu işlem önizlemesi ve ekran
# tercihi içindir.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_products
name: "Ürünler"
description: "Mağaza ürün kataloğu, varyant, fiyat ve stok yönetimi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: [store_api]

# Silinmiş ürün tespiti — SAF KURAL, tek yerde (backend/deleted.py).
#
# Aynı soruyu üç ekran soruyor: ürün geçmişi (burası), sipariş kalemleri
# (store_orders), satış raporu (store_reports). Kural kopyalansaydı bir gün
# ayrışır ve aynı sipariş bir ekranda "silinmiş", ötekinde normal görünürdü.
# Modül modülü import etmez (K3): kural registry'den paylaşılır.
provides:
  - capability: store_products.deleted_marker
    contract: km_sdk.contracts:DeletedProductMarker
    description: "Sipariş kalemi silinmiş üründen mi — kırmızı “silinmiş” ibaresinin tek kuralı."

consumes:
  - capability: store.api
    reason: "Mağaza verisi tek kapıdan geçer (K4)."
  - capability: printer
    optional: true
    reason: "Stok raporu ve fiyat listesi kâğıda basılır; yazıcı yoksa ekran çalışmaya devam eder."

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_products
  router: backend.api.routes:router
  tags: ["store_products"]
  requires: [store_products.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Ürünler"
    icon: box
    group: "BBD Store"
    order: 20
    requires: [store_products.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına bağlanacak,
# mağaza ekranları PIN istemiyor. Koruma üç katmanlı: ayrı izin anahtarı +
# gerekçe (>=10 karakter, backend'de de doğrulanır) + dryRun varsayılanı.
# Silmede DÖRDÜNCÜ katman var: ne silineceğini gösteren önizleme (kaç siparişte
# geçtiği ve kaç adet satıldığı dahil) görülmeden düğme açılmaz.
permissions:
  - key: store_products.view
    description: "Ürünler ekranını görüntüleme, rapor ve CSV alma."
    default_roles: [admin, bbd_staff]
  - key: store_products.manage
    description: "Ürün künyesi, fiyat, stok, görsel ve kategori düzenleme."
    default_roles: [admin, bbd_staff]
  - key: store_products.bulk
    description: "Toplu fiyat/stok/kategori/durum uygulaması (önizleme zorunlu)."
    default_roles: [admin, bbd_staff]
  - key: store_products.deactivate
    description: "Ürünü pasifleştirme (vitrinden kaldırma). Geri alınabilir; kayıt silinmez."
    default_roles: [admin]
  # SİLME PASİFLEŞTİRMEDEN AYRI ANAHTARDIR. Pasifleştirme geri alınabilir,
  # silme alınamaz: ürün kaydı, öznitelik değerleri, görselleri ve stok
  # satırları mağazadan gider. İkisini tek anahtarla korumak, "vitrinden
  # kaldır" yetkisi verilen personele kataloğu silme yetkisi de vermek olurdu.
  #
  # Geçmiş GÜVENDE: order_items ürünün adını/SKU'sunu/fiyatını kendi satırında
  # saklıyor ve products'a yabancı anahtar kısıtı yok — silme raporları
  # bozmaz, kalem kırmızı "silinmiş" ile görünür.
  - key: store_products.delete
    description: "Ürünü katalogdan silme. GERİ ALINAMAZ; gerekçe ve önizleme zorunlu."
    default_roles: [admin]
  - key: store_products.rename_sku
    description: "SKU değiştirme. product_flat yeniden yazılır, eski vitrin bağlantıları kırılır."
    default_roles: [admin]
  # Nitelik kataloğun ŞEMASIDIR: bir niteliği bozmak tek ürünü değil o niteliği
  # taşıyan bütün ürünleri etkiler. Ürün düzenlemekten (manage) ayrı tutulur.
  - key: store_products.attributes
    description: "Nitelik ve aile düzenleme, seçenek yönetimi, nitelik pasifleştirme."
    default_roles: [admin]
  - key: store_products.attributes_delete
    description: "Nitelik/seçenek silme. Değeri bütün ürünlerden düşer; geri alınamaz."
    default_roles: [admin]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
