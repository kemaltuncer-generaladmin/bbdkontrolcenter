# Setler — BBD Store'un paket satışları.
#
# Bu ekran mağaza verisine YALNIZ `store.api` yeteneğinden bakar (K4); ham
# httpx ya da DB sürücüsü kullanmaz. Ürün/fiyat/stok kopyalanmaz: yerel tablo
# yalnız set künyesini (bileşen adedi, indirimi, zorunluluğu — mağazada
# karşılığı YOK) ve yazma gerekçesini tutar.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_bundles
name: "Setler"
description: "Set/paket bileşenleri ve set fiyatının kâr-zarar hesabı."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: [store_api]

provides: []

consumes:
  - capability: store.api
    reason: "Mağaza verisi tek kapıdan geçer (K4)."
  - capability: printer
    optional: true
    reason: "Set listesi ve riskli set raporu kâğıda basılır; yazıcı yoksa ekran çalışmaya devam eder."

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_bundles
  router: backend.api.routes:router
  tags: ["store_bundles"]
  requires: [store_bundles.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Setler"
    icon: layers
    group: "BBD Store"
    order: 30
    requires: [store_bundles.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına bağlanacak,
# mağaza ekranları PIN istemiyor. Koruma üç katmanlı: ayrı izin anahtarı +
# gerekçe (>=10 karakter, backend'de de doğrulanır) + dryRun varsayılanı.
permissions:
  - key: store_bundles.view
    description: "Setler ekranını görüntüleme, kâr hesabı, rapor ve CSV alma."
    default_roles: [admin, bbd_staff]
  - key: store_bundles.manage
    description: "Set künyesi ve bileşen tablosu düzenleme."
    default_roles: [admin, bbd_staff]
  - key: store_bundles.deactivate
    description: "Seti vitrinden kaldırma. Silme yoktur: satılmış setin künyesi saklanır."
    default_roles: [admin]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

# Bağımlılık ilan edilir, kopyalanmaz (K11). Yeni PyPI paketi gerekmiyor:
# mağaza erişimi `store.api`, PDF üretimi çekirdeğin işi. Ama rapor
# ÖNİZLEMESİ `pdftoppm` çalıştırıyor (backend/service.py · `_render_pages`);
# ilan edilmezse kurulum betiği onu toplamaz ve önizleme sessizce hiç
# gelmez.
dependencies:
  python: []
  system:
    - poppler-utils        # `pdftoppm` — rapor önizlemesi. Yoksa rapor yine yazılır ve basılır.
  capabilities_note: >
    Yazdırma `printer` platform yeteneğinden, mağaza erişimi `store.api`
    yeteneğinden gelir; ikisi de burada TEKRAR EDİLMEZ (consumes bloğunda).

tasks: []
