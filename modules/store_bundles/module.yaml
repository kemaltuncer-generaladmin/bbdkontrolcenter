# Setler modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_bundles
name: "Setler"
description: "Birden çok üründen oluşan set/paket tanımları."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_bundles
  router: backend.api.routes:router
  tags: ["store_bundles"]
  requires: [store_bundles.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Setler"
    icon: layers
    group: "BBD Store"
    order: 30
    requires: [store_bundles.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: store_bundles.view
    description: "Setler ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: store_bundles.manage
    description: "Setler kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
