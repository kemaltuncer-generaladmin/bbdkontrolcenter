# BBD Store geçidi — mağazanın yönetici API'sine açılan TEK kapı.
#
# NEDEN AYRI MODÜL: 20 mağaza ekranı aynı Bagisto REST yüzeyine bakıyor. Her
# biri kendi HTTP istemcisini yazsaydı belirteç, yeniden deneme, hız sınırı,
# sayfalama, kuru prova ve gerekçe taşıma yirmi yerde tekrarlanır — ve yirmi
# yerde farklı biçimde yanlış olurdu. Geçit bunları tek yerde tutar ve
# `store.api` yeteneği olarak sunar (K3, K4).
#
# NEDEN PLATFORM DEĞİL: BBD Store bir iş sistemidir, altyapı değil.
# Silinebilir olmalı; `km_platform` silinemez olanların yeridir (ADR 0006).
#
# EKRANI, İZNİ, HTTP YÜZEYİ YOKTUR: menüde görünmez, uç nokta açmaz. Yalnız
# diğer modüllere hizmet eder. Yetkilendirme çağıran ekranın işidir (K9).

id: store_api
name: "Mağaza Geçidi"
description: "BBD Store yönetici API'sine tek kapı: kimlik, hız sınırı, sayfalama, kuru prova, gerekçe taşıma."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: []

provides:
  - capability: store.api
    contract: km_sdk.contracts:StoreApi
    description: "Mağaza yönetici API'si: sipariş, ürün, müşteri, fatura, iade, kargo, ayar."

consumes:
  - capability: secrets
    reason: "Yönetici belirteci kasada durur; depoda ve ayarda bulunmaz (K8)."

events:
  publishes: []
  subscribes: []

# HTTP yüzeyi YOK: bu modül dışarıya uç nokta açmaz, yalnız yetenek verir.

permissions: []

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

dependencies:
  python:
    - "httpx>=0.28"

tasks: []
