# Abonelikler modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: bld_subscriptions
name: "Abonelikler"
description: "Abonelik planları, kapalı günler ve yenileme takibi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/bld_subscriptions
  router: backend.api.routes:router
  tags: ["bld_subscriptions"]
  requires: [bld_subscriptions.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Abonelikler"
    icon: repeat
    group: "BLD"
    order: 90
    requires: [bld_subscriptions.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: bld_subscriptions.view
    description: "Abonelikler ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: bld_subscriptions.manage
    description: "Abonelikler kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
