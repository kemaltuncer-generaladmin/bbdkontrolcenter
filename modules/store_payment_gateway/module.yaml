# Link ile Ödeme — uzaktaki müşteriden karttan tahsilat.
#
# BU EKRAN POS İZLEME DEĞİLDİR. Banka mutabakatı, terminal ayarı ve
# taksit/komisyon matrisi burada yoktur; burada tek bir iş vardır: personel
# formu doldurur → ön izleme → gerekçeli onay → ödeme bağlantısı → SMS →
# müşteri karttan öder → sipariş ve fatura mağazada oluşur → yoklamayla
# durum görünür.
#
# Mağaza verisi YALNIZ `store.api` yeteneğinden geçer (K4). SMS `notify`
# platform yeteneğinden gider ve üç katmanlı freni vardır. Yerel tablolar
# yalnız Bagisto'da KARŞILIĞI OLMAYAN veriyi tutar: müşteri ödemeden önce
# sipariş yoktur, dolayısıyla tahsilat talebi hiçbir mağaza tablosuna düşmez.
#
# BUGÜNKÜ GERÇEK (16.08.2026, canlıya karşı GET ile doğrulandı): mağazanın
# ödeme uçları YAYINDA — `payment-links`, `payments/attempts` ve
# `payments/terminals` 200 dönüyor, `POST payment-links` route:list'te kayıtlı.
# 13.08.2026'da üçü de 404'tü ve burada "hiçbiri yayında değil" yazıyordu;
# o cümle artık geçerli değil, yol adı da `payments/links` değil `payment-links`.
#
# Geçit eşlemesi BAĞLANDI: ekran artık `store.api → bbd_create_payment_link`
# metodunu çağırıyor (bir dönem hiç var olmamış `bbd_create_payment_request`
# adını yokluyordu ve düğme bu yüzden hiç açılmadı). Gövde mağazanın
# sözleşmesidir: tutar ondalık TL metni, il `state`/ilçe `city`, sipariş kimliği
# GÖNDERİLMEZ, `dryRun` gövdeye AÇIKÇA yazılır (mağaza varsayılanı true; alan
# hiç gitmezse gerçek istek sessizce kuru provaya düşerdi). Modül durumu yine
# açılışta yokluyor ve uç düşerse ekranda söylüyor; ikinci tahsilat yolu Elden
# Kapatma (çekirdek `POST /admin/transactions`). Ayrıntı: README.
#
# LİNKİN İKİ KİMLİĞİ AYRI TUTULUR: `token` (= mağazanın `code`u) insanın
# okuduğu koddur; mağaza uçları ise SAYISAL `id` ister (`whereNumber('id')`).
# Sayısal kimlik `link_id` sütununda durur (göç 002); yoklama tekil uçtan okur,
# iptal onunla çağrılır ve yeni bağlantı üretilmeden önce eskisi kapatılır.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_payment_gateway
name: "Link ile Ödeme"
description: "Uzaktaki müşteriye ödeme bağlantısı: form, ön izleme, SMS, durum yoklaması, elden kapatma."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: [store_api]

provides: []

consumes:
  - capability: store.api
    reason: "Ödeme bağlantısı, sipariş ve fatura tek kapıdan geçer (K4)."
  - capability: notify
    optional: true
    reason: "Ödeme bağlantısı SMS ile gider. Yoksa ekran çalışır; bağlantı elle kopyalanır ve SMS bölümü gerekçesiyle kapalı görünür."
  - capability: printer
    optional: true
    reason: "Tahsilat icmali kâğıda basılır; yazıcı yoksa ekran çalışmaya devam eder."
  - capability: secrets
    optional: true
    reason: "Netgsm kullanıcı adı/parola/başlığı kasada durur (`notify.netgsm.*`); ayar
      tablosuna yazılamaz (K8). Kasa yoksa ekran çalışır, yalnız SMS ayarları kartı kapalı
      görünür. Hesap bbdkantin ile ORTAKTIR — anahtar adları aynıdır."

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_payment_gateway
  router: backend.api.routes:router
  tags: ["store_payment_gateway"]
  requires: [store_payment_gateway.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Link ile Ödeme"
    icon: credit_card
    group: "BBD Store / Satış ve Kargo"
    order: 250
    requires: [store_payment_gateway.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına bağlanacak,
# mağaza ekranları PIN istemiyor. Koruma üç katmanlı: ayrı izin anahtarı +
# gerekçe (>=10 karakter, backend'de de doğrulanır) + dryRun varsayılanı.
permissions:
  - key: store_payment_gateway.view
    description: "Tahsilat ekranını görüntüleme, liste, rapor ve CSV alma."
    default_roles: [admin, bbd_staff]
  - key: store_payment_gateway.manage
    description: "Tahsilat talebi açma, SMS şablonunu ve Netgsm ayarlarını düzenleme."
    default_roles: [admin, bbd_staff]
  - key: store_payment_gateway.collect
    description: "Ödeme bağlantısı üretme ve SMS gönderme. Para hareketi başlatır."
    default_roles: [admin, bbd_staff]
  - key: store_payment_gateway.settle
    description: "Elden kapatma: havale/nakit beyanı. Mağazaya ödeme kaydı yazar."
    default_roles: [admin]
  - key: store_payment_gateway.cancel
    description: "Ödeme bağlantısını iptal etme. Kayıt silinmez, bağlantı ölür."
    default_roles: [admin]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

dependencies:
  capabilities_note: "SMS `notify`, mağaza erişimi `store.api`, baskı `printer` yeteneğinden gelir; ayrıca Python bağımlılığı yoktur."

tasks: []
