# Sanal POS modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_payment_gateway
name: "Sanal POS"
description: "Sanal POS yapılandırması ve ödeme işlemlerinin izlenmesi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_payment_gateway
  router: backend.api.routes:router
  tags: ["store_payment_gateway"]
  requires: [store_payment_gateway.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Sanal POS"
    icon: credit_card
    group: "BBD Store"
    order: 110
    requires: [store_payment_gateway.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: store_payment_gateway.view
    description: "Sanal POS ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: store_payment_gateway.manage
    description: "Sanal POS kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
