# Kantin geçidi varsayılanları.
# Bu kurulumun ortak kantin API adresi; yerel/test ortamı config/local.yaml ile
# kendi adresini verebilir.
base_url: "https://kantin.bbdstore.com.tr"
device_name: "Kontrol Merkezi"
timeout_seconds: 20
# Bağlantı kurma (TCP + TLS) sınırı. Kantin kapalıysa okuma süresini beklemeden
# hata verilir; bağlantı havuzda tutulur (keep-alive), her istekte yeniden kurulmaz.
connect_timeout_seconds: 5
