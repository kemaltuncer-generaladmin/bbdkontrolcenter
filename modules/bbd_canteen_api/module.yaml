# Kantin geçidi — kasa API'sine açılan TEK kapı.
#
# NEDEN AYRI MODÜL: kantin verisine birden fazla modül bakacak (öğrenci
# yönetimi, kantin ürünleri, kantin raporları, ödeme talebi, toplu satış).
# Her biri kendi HTTP istemcisini yazsaydı cihaz token'ı, yeniden deneme ve
# hata biçimi beş yerde tekrarlanırdı. Geçit bunları tek yerde tutar ve
# `canteen.api` yeteneği olarak sunar (K3).
#
# NEDEN PLATFORM DEĞİL: kantin bir iş sistemidir, altyapı değil. Silinebilir
# olmalı; `km_platform` silinemez olanların yeridir (ADR 0006).
#
# EKRANI YOKTUR: `ui` bloğu yok, menüde görünmez. Diğer modüllere hizmet eder.
#
# MERKEZİ SENKRON (bbd-akademi docs/integrations/km-merkezi-senkron.md §6):
# kantinden gelen olayların ALICISIDIR. Tek HTTP ucu `POST
# /api/bbd_canteen_api/v1/events` — kantin backend'i KM servis anahtarıyla
# (ADR 0028, rol `canteen_service`) iter; KM ayrıca 30 sn'de bir çeker.

id: bbd_canteen_api
name: "Kantin Geçidi"
description: "BBD kantin kasa API'sine tek kapı: cihaz kaydı, öğrenci okuma/yazma, QR anahtarı."
version: 0.2.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: []

provides:
  - capability: canteen.api
    contract: km_sdk.contracts:CanteenApi
    description: >
      Kantin kasa API'si: öğrenciler, ayarlar, QR anahtarı; veli kantin
      kontrolleri (get_student, update_controls), serbest tutarlı ödeme talebi
      (create_payment_request(student_id, amount=None, origin="admin")), nakit
      tahsilat (record_collection), öğrenci süzgeçli işlem ve talep listesi
      (transactions(student_id=), payment_requests(student_id=)), ödeme talebi
      ve veli bildirim akışları ({data, nextSince, hasMore}), ön ödeme ayarı
      (canteen_settings_public). Merkezi senkron: set_student_status(id,
      status, reason, at), delete_student(id) (409 balance_not_zero /
      open_payment_request), balances(ids=None, etag=None) → {ledgerSeq, items,
      etag} | None (304), events_after(after, limit) → {items, lastId,
      hasMore}; eski kantinde uç yoksa reason=not_supported. Yankı belleği:
      remember_write / recently_written(id, kind, fields). Red
      `CanteenError.reason` koduyla gelir; gövde ayrıntısı (ör. balance,
      maxAmount) `CanteenError.details`.

consumes:
  - capability: secrets
    reason: "Cihaz kayıt sırrı ve alınan cihaz token'ı kasada durur (K8)."
  - capability: events.outbox
    optional: true
    reason: "Kantin olaylarının KM karşılığı (bakiye, kontrol, ödeme talebi) kalıcı outbox'a yazılır (ADR 0029)."
  - capability: bbd_students.sync
    optional: true
    reason: "Kasadaki öğrenci ekleme/güncellemesinin KM kaydı Öğrenci Yönetimi'ndedir (K5); dizin önbelleği oradan bırakılır. Yoksa olay doğrudan outbox'a yazılır."

events:
  publishes:
    - name: canteen.device_enrolled
      description: >
        Kantine yeni bir cihaz kaydolduğunda. BU MODÜL HENÜZ YAYINLAMIYOR:
        geçit kendi kaydını `_ensure_token` içinde sessizce yapıyor ve
        elinde olay yolu yok. Olayın İLK GERÇEK YAYINCISI
        `bbd_canteen_devices`tir — kiosk eşlemesini Kontrol Merkezi
        başlatmadığı için (kodu cihaz giriyor) eşleme, kiosk listesi
        okunurken fark edilerek duyurulur.
  subscribes: []

# TEK HTTP UCU: kantinin olay itmesi. Çift kapı (K9): router da uç da
# `bbd_canteen_api.events.push` ister (mobile_gateway kalıbı).
http:
  prefix: /api/bbd_canteen_api/v1
  router: backend.api.routes:router
  tags: ["bbd_canteen_api"]
  requires: [bbd_canteen_api.events.push]

# `admin` da taşır (çekirdekte admin her ilan edilen izne sahiptir); asıl
# sahibi `canteen_service` servis rolüdür (kişiye verilmez — ADR 0028).
permissions:
  - key: bbd_canteen_api.events.push
    description: "Kantin backend'inin KM'ye olay itmesi (satış/bakiye, kasadan öğrenci, kontroller, ödeme talebi). Servis anahtarı içindir."
    default_roles: [admin, canteen_service]

migrations: backend/migrations

config:
  defaults: config/default.yaml

dependencies:
  python:
    - "httpx>=0.28"

tasks: []
