# Kontrol Paneli — mağazanın canlı özeti.
#
# Bu ekran mağaza verisine YALNIZ `store.api` yeteneğinden bakar (K4); ham
# httpx ya da DB sürücüsü kullanmaz ve Bagisto verisinin kopyasını TUTMAZ:
# pano yanlış rakam göstermemek için her açılışta taze okur. Yerel tablolar
# sadece gerekçe (denetim izi) ve ekran tercihi içindir.
#
# `store_settings` ekranı YOKTUR: mağaza kimliği, kanal/para/dil,
# yerelleştirme, bakım modu, SEO ve rapor klasörü buraya düştü.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_dashboard
name: "Kontrol Paneli"
description: "Mağazanın canlı özeti: sipariş, ciro, stok ve sistem durumu."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: [store_api]

provides: []

consumes:
  - capability: store.api
    reason: "Mağaza verisi tek kapıdan geçer (K4)."
  - capability: printer
    optional: true
    reason: "Günlük özet raporu kâğıda basılır; yazıcı yoksa ekran çalışmaya devam eder."

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_dashboard
  router: backend.api.routes:router
  tags: ["store_dashboard"]
  requires: [store_dashboard.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Kontrol Paneli"
    icon: gauge
    group: "BBD Store"
    order: 10
    requires: [store_dashboard.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına bağlanacak,
# mağaza ekranları PIN istemiyor. Koruma üç katmanlı: ayrı izin anahtarı +
# gerekçe (>=10 karakter, backend'de de doğrulanır) + dryRun varsayılanı.
permissions:
  - key: store_dashboard.view
    description: "Kontrol Panelini görüntüleme, pano raporu ve CSV alma."
    default_roles: [admin, bbd_staff]
  - key: store_dashboard.manage
    description: "Mağaza kimliği, SEO, çalışma kanalı ve yerelleştirme ayarlarını düzenleme."
    default_roles: [admin, bbd_staff]
  - key: store_dashboard.maintenance
    description: "Bakım modunu açma/kapatma. Vitrini kapatır; gerekçe zorunludur."
    default_roles: [admin]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
