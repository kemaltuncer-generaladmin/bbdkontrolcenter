# Deneme Kulübü modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_trial_club
name: "Deneme Kulübü"
description: "Deneme sınavı kulübü içerikleri ve katılımcı yönetimi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/store_trial_club
  router: backend.api.routes:router
  tags: ["store_trial_club"]
  requires: [store_trial_club.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Deneme Kulübü"
    icon: sparkles
    group: "BBD Store"
    order: 70
    requires: [store_trial_club.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: store_trial_club.view
    description: "Deneme Kulübü ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: store_trial_club.manage
    description: "Deneme Kulübü kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
