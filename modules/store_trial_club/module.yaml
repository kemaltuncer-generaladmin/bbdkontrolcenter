# Deneme Kulübü — BBD Store deneme sınavı kulübü.
#
# Bu ekran mağaza verisine YALNIZ `store.api` yeteneğinden bakar (K4); ham
# httpx ya da DB sürücüsü kullanmaz. Deneme, katılımcı ve sonuç kayıtları
# mağazadadır (`/api/admin/bbd/trial-club/*`) ve kopyalanmaz. Yerel tablolar
# yalnız gerekçe (denetim izi), sonuç yükleme önizlemesi ve ekran tercihi
# içindir.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_trial_club
name: "Deneme Kulübü"
description: "Deneme sınavları, kontenjan, katılımcı, CSV ile sonuç yükleme ve karne çıktısı."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

# Geçit bizden önce yüklenmeli: yükleme sırası alfabetik değil, bu alana göre
# kurulur.
depends: [store_api]

provides: []

consumes:
  - capability: store.api
    reason: "Deneme, katılımcı ve sonuç verisi tek kapıdan geçer (K4)."
  - capability: printer
    optional: true
    reason: "Yoklama çizelgesi ve sonuç karnesi kâğıda basılır; yazıcı yoksa PDF yine üretilir."
  - capability: store.notify.send
    optional: true
    reason: "Katılımcı satırındaki tek kişilik hatırlatma. Bildirimler ekranı kapalıysa düğme gizlenir. Toplu bildirim bu yetenekten DEĞİL, geçidin toplu ucundan gider."

events:
  publishes:
    - name: store.trial.results_published
      payload: "{examId, actor}"
      description: "Bir denemenin sonuçları yayınlandı; katılımcı artık karnesini görüyor."
  subscribes: []

http:
  prefix: /api/store_trial_club
  router: backend.api.routes:router
  tags: ["store_trial_club"]
  requires: [store_trial_club.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Deneme Kulübü"
    icon: sparkles
    group: "BBD Store / Vitrin ve İçerik"
    order: 310
    requires: [store_trial_club.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına bağlanacak,
# mağaza ekranları PIN istemiyor. Koruma üç katmanlı: ayrı izin anahtarı +
# gerekçe (>=10 karakter, backend'de de doğrulanır) + dryRun varsayılanı.
permissions:
  - key: store_trial_club.view
    description: "Deneme Kulübü ekranını görüntüleme, yoklama/karne PDF ve CSV alma."
    default_roles: [admin, bbd_staff]
  - key: store_trial_club.manage
    description: "Deneme açma/düzenleme, kontenjan değiştirme ve ekran tercihleri."
    default_roles: [admin, bbd_staff]
  - key: store_trial_club.enroll
    description: "Katılımcı ekleme ve kayıt iptali. Kayıt silinmez, iptal edilir."
    default_roles: [admin, bbd_staff]
  - key: store_trial_club.publish
    description: "Sonuç yükleme ve yayınlama. Yayınlanan sonuç katılımcıya görünür olur."
    default_roles: [admin]
  - key: store_trial_club.notify
    description: "Toplu bildirim gönderme. SMS PARA HARCAR."
    default_roles: [admin]

config:
  defaults: config/default.yaml
  schema: config/schema.json

dependencies:
  python: []
  system:
    - poppler-utils
  capabilities_note: >-
    PDF üretimi çekirdeğin `reporting` ekstrasındaki reportlab ile yapılır ve
    burada TEKRAR EDİLMEZ. Yazdırma `printer`, bildirim `store.notify.send`
    yeteneğinden geçer; ikisi de `consumes` altında ilan edilmiştir.
    `poppler-utils` yalnız rapor ÖNİZLEMESİ (pdftoppm) için gerekir; yoksa
    rapor yine üretilir, önizleme yerine açıklayıcı bir not görünür.

migrations: backend/migrations

tasks: []
