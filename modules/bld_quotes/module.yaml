# Teklif Talepleri modülü — İSKELET
# Sözleşme burada sabittir; kod henüz yazılmadı, bu yüzden enabled: false.
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: bld_quotes
name: "Teklif Talepleri"
description: "Siteden gelen catering/teklif taleplerinin yönetimi."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: false

entrypoint: backend.module:register

depends: []
provides: []
consumes: []

events:
  publishes: []
  subscribes: []

http:
  prefix: /api/bld_quotes
  router: backend.api.routes:router
  tags: ["bld_quotes"]
  requires: [bld_quotes.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Teklif Talepleri"
    icon: file_plus
    group: "BLD"
    order: 610
    requires: [bld_quotes.view]

# Katalog ve rol matrisi: docs/permissions.md
# GELİŞTİRME KURALI: ekranlar şimdilik tüm rollere açık. Daraltma, o modülün
# kodlaması başlarken yapılacak.
permissions:
  - key: bld_quotes.view
    description: "Teklif Talepleri ekranını görüntüleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]
  - key: bld_quotes.manage
    description: "Teklif Talepleri kayıtlarını düzenleme."
    default_roles: [admin, bbd_staff, bld_staff, org_staff, accountant]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

tasks: []
