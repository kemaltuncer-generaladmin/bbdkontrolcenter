# Ana Ekran Görselleri ayarları. Düz anahtarlar — iç içe `modules:` bloğu yoktur.

export_path: ""            # boşsa masaüstü hiyerarşisi: Raporlar/Mağaza/Müşteri/<yıl>/<ay>
channel: "default"         # her istekte gider (kanal başına ayrı ana sayfa olabilir)
locale: "tr"               # her istekte gider

# Önerilen görsel ölçüleri — alan başına "<en>x<boy>". Tema değişirse burası
# değişir; ölçü kararı koda gömülmez. "0x0" o alanın görsel istemediğini söyler
# (duyuru şeridi metindir).
recommended_slider: "1920x640"
recommended_banner: "1200x400"
recommended_collection: "800x800"
recommended_announcement: "0x0"

# Yüklenen görselin çözünürlüğü önerilenin bu oranından küçükse "mobilde
# bulanık" denir. 1.0 = birebir; 0.9 küçük sapmayı hoş görür.
sharp_ratio: 1.0

# En/boy oranı bu yüzdeden fazla saparsa görsel kenarlardan kırpılır; ekran
# söyler, sessizce yüklemez.
aspect_tolerance: 8

# Base64 gövdeyle taşınan görselin tavanı. 2 MB'ın üstü hem isteği yavaşlatır
# hem de vitrinde ilk ekranın açılışını geciktirir; asıl sınır budur.
max_image_bytes: 2000000
allowed_image_types: ["image/png", "image/jpeg", "image/webp"]

# Hedef bağlantı seçicisinde gösterilecek en çok ürün/sayfa sayısı.
link_search_limit: 20
