# Ana Ekran Görselleri — siteye ilk girişte dönen kayan görseller.
#
# TEK İŞ. Bu ekran o görselleri değiştirir, sıralarını belirler ve tıklanınca
# nereye gideceklerini seçer. Başka hiçbir şey yapmaz.
#
# 18.08.2026'DA ÜÇ SEKME KALDIRILDI (kullanıcı kararı): tanıtım görselleri,
# öne çıkan ürün grupları ve üst duyuru yazısı. Üçünün de mağazada bu uçtan
# yazılabilir bir karşılığı yoktu; ekranın yarısı "bu bölüm şu an
# düzenlenemiyor" demeye çalışıyordu. Onlarla birlikte yayın tarihleri, cihaz
# seçimi, yayına alma/kaldırma, süzgeçler, yerleşim raporu ve CSV de kalktı.
#
# Bu ekran mağaza verisine YALNIZ `store.api` yeteneğinden bakar (K4); ham
# httpx ya da DB sürücüsü kullanmaz. Slayt verisinin kopyasını tutmaz: yerel
# tablolar yalnız gerekçeyi (denetim izi) ve yüklenen görselin ölçü kararını
# saklar — ikisinin de Bagisto'da karşılığı yok.
#
# Şema: docs/schemas/module.schema.json · Kılavuz: docs/module-guide.md

id: store_home_media
name: "Ana Ekran Görselleri"
description: "Siteye ilk girişte dönen kayan görseller: görseli değiştir, sırayı belirle,\n  tıklanınca gideceği yeri seç."
version: 0.1.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: [store_api]

provides: []

consumes:
  - capability: store.api
    reason: "Mağaza verisi tek kapıdan geçer (K4)."

events:
  publishes:
    - name: store_home_media.layout_changed
      description: >-
        Ana ekrandaki görsel listesi gerçekten değiştiğinde (kuru provada DEĞİL)
        yayılır. Panoya "vitrin bugün değişti" bilgisini taşır; kimse dinlemese de
        olay ilan edilir, çünkü modül modülü çağıramaz (K3).
  subscribes: []

http:
  prefix: /api/store_home_media
  router: backend.api.routes:router
  tags: ["store_home_media"]
  requires: [store_home_media.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Ana Ekran Görselleri"
    icon: image
    group: "BBD Store / Vitrin ve İçerik"
    order: 290
    requires: [store_home_media.view]

# Katalog ve rol matrisi: docs/permissions.md · Yıkıcı işlem: ADR 0012.
# `destructive: true` KULLANILMAZ — o bayrak çekirdekte PIN kapısına bağlanacak,
# mağaza ekranları PIN istemiyor. Koruma iki katmanlı: ayrı izin anahtarı +
# gerekçe (>=10 karakter, backend'de de doğrulanır).
#
# `store_home_media.publish` KALDIRILDI. "Yayına al / yayından kaldır" ayrı bir
# izindi çünkü kaydetmek ile müşteriye göstermek ayrı iki işti. Slaytta böyle
# bir ayrım YOK: liste yazıldığı anda vitrinde o liste dönüyor, taslak hâli
# diye bir durum mağazada bulunmuyor. Karşılıksız kalan bir izin anahtarı,
# rol matrisinde bir şeyi koruduğunu sanmaktan başka bir işe yaramaz.
permissions:
  - key: store_home_media.view
    description: "Ana ekran görsellerini görüntüleme ve değişiklik geçmişini okuma."
    default_roles: [admin, bbd_staff]
  - key: store_home_media.manage
    description: >-
      Ana ekrandaki görselleri değiştirme: yeni görsel yükleme, sırayı belirleme
      ve tıklanınca gidilecek adresi seçme. Yazma anında müşteri de görür.
    default_roles: [admin, bbd_staff]

config:
  defaults: config/default.yaml
  schema: config/schema.json

migrations: backend/migrations

dependencies:
  capabilities_note: >-
    Görsel tarayıcıda FileReader ile base64'e çevrilip gövdede taşınır; ek Python
    bağımlılığı yoktur. Görselin en/boy ölçüsü başlıktan okunur
    (backend/slots.py), Pillow KURULMAZ — tek iş için 40 MB'lık bağımlılık ilan
    etmek K11'in ruhuna aykırıdır. Yükleme geçidin `store.api.upload_media`
    metodunu (POST /api/admin/bbd/storefront/home-slides/image) kullanır.

tasks: []
