# Zil sistemi modülü
# Şema: docs/schemas/module.schema.json
#
# ZİL GERÇEKTEN ÇALAR. İki hedefi vardır:
#   1. Okulun zil sistemine bağlı Windows bilgisayarı (asıl hoparlör) —
#      `store.api` üzerinden bbdstore köprüsüne komut yazılır.
#   2. Yerel ses aygıtı — `audio` yeteneği; yedek ve geliştirme içindir.
#
# BAĞIMLILIK YÖNÜ TERSİNE ÇEVRİLDİ. Eskiden ders saatleri Ders Takvimi'nindi ve
# zil onları okuyordu. Artık haftalık zil saatlerinin ve grupların sahibi burasıdır;
# Ders Takvimi ekranı `bell.week` yeteneğinden okuyup SALT OKUNUR gösterir (K3).

id: bell
name: "Zil Sistemi"
description: "Haftalık zil saatleri, sesli anons ve grup çağrısı."
version: 0.2.0
sdk: ">=0.1,<1.0"
enabled: true

entrypoint: backend.module:register

depends: []

provides:
  - capability: bell.week
    contract: backend.service:BellService.week
    description: "Haftalık zil saatleri ve gruplar — salt okunur."

consumes:
  - capability: audio
    reason: "Sesi yerel aygıttan çalmak (yedek yol) ve ses dosyalarını çözmek için."
  - capability: scheduler
    reason: "Haftalık zil saatlerine göre tetikleme."
  - capability: secrets
    reason: "Vertex servis hesabı ve köprü belirteci kasadan okunur (K8)."
  - capability: notify
    optional: true
    reason: "Zil çalınamadığında uyarı."

events:
  publishes:
    - name: bell.rang
      description: "Bir zil ya da anons başarıyla çalındığında yayınlanır."
    - name: bell.failed
      description: "Çalınamadığında yayınlanır."
  subscribes: []

http:
  prefix: /api/bell
  router: backend.api.routes:router
  tags: ["bell"]
  requires: [bell.view]

ui:
  entry: ui/panel/index.js
  locales: ui/locales
  nav:
    title: "Zil Sistemi"
    icon: bell
    group: "BBD"
    order: 20
    requires: [bell.view]

# Katalog ve rol matrisi: docs/permissions.md
permissions:
  - key: bell.view
    description: "Zil saatlerini, grupları ve çalma günlüğünü görüntüleme."
    default_roles: [admin, org_staff, bbd_staff]
  - key: bell.manage
    description: "Zil saatlerini, grupları, sesleri ve anons metinlerini düzenleme."
    default_roles: [admin, org_staff]
  - key: bell.ring_now
    description: "Elle zil çalma ve grup çağırma."
    default_roles: [admin, org_staff, bbd_staff]

config:
  defaults: config/default.yaml
  schema: config/schema.json

# Bağımlılık ilan edilir, kopyalanmaz (K11 — ADR 0008).
dependencies:
  python:
    - "httpx>=0.28"           # Vertex ve köprü istekleri
    # Servis hesabı JWT'si RS256 ile imzalanır. `google-auth` KULLANILMIYOR:
    # erişim belirteci için senkron `requests` taşıyıcısı istiyor. Akış küçük,
    # kasa zaten cryptography'e dayanıyor (bkz. backend/speech.py başlığı).
    - "cryptography>=43"
  capabilities_note: >
    Ses çalma `audio`, tetikleme `scheduler`, sır erişimi `secrets` platform
    yeteneğinden gelir; burada tekrar edilmez.

migrations: backend/migrations

tasks: []
